/* ============================================================
   MATCH PAGE
============================================================ */
function MatchPage({ matches, setMatches, players, matchPresets, setMatchPresets, T, showToast, pendingAction, setPendingAction }) {
  const [view, setView] = useState('list'); // list | edit | live | recap
  const [editing, setEditing] = useState(null);
  const [recapMatch, setRecapMatch] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [tabs, setTabs] = useState(0); // 0=upcoming 1=done 2=all

  const filteredMatches = useMemo(() => {
    const today = todayIso();
    let result = [...matches];
    if (tabs === 0) result = result.filter(m => m.status !== 'done' && m.date >= today);
    else if (tabs === 1) result = result.filter(m => m.status === 'done');
    result.sort((a,b) => tabs===1 ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
    return result;
  }, [matches, tabs]);

  function startNew(prefill) {
    const m = newMatch();
    if (prefill && prefill.date) m.date = prefill.date;
    if (prefill && prefill.time) m.time = prefill.time;
    m.lineup = ensureLineupArray(m);
    setEditing(m); setView('edit'); setRecapMatch(null);
  }
  function startEdit(m) {
    const copy = { ...m, lineup: ensureLineupArray(m) };
    setEditing(copy); setView('edit'); setRecapMatch(null);
  }
  function openMatch(m) {
    if (m.status === 'done') {
      setRecapMatch(m); setView('recap');
    } else {
      startEdit(m);
    }
  }

  // Consume pendingAction (from calendar deep-link)
  useEffect(() => {
    if (!pendingAction) return;
    if (pendingAction.type === 'newMatch') {
      startNew({ date: pendingAction.date, time: pendingAction.time });
      setPendingAction(null);
    } else if (pendingAction.type === 'openMatch' && pendingAction.id) {
      const m = matches.find(x => x.id === pendingAction.id);
      if (m) openMatch(m);
      setPendingAction(null);
    }
  }, [pendingAction]);
  function saveMatch() {
    if (!editing) return;
    setMatches(prev => {
      const idx = prev.findIndex(m => m.id === editing.id);
      if (idx >= 0) { const copy=[...prev]; copy[idx]=editing; return copy; }
      return [...prev, editing];
    });
    if (editing.status === 'done') {
      setRecapMatch(editing); setView('recap');
    } else {
      setView('list');
    }
    setEditing(null);
    showToast('Match enregistré', 'success');
  }
  function deleteMatch(m) {
    setMatches(prev => prev.filter(x => x.id !== m.id));
    setConfirmDelete(null);
    if (editing && editing.id===m.id) { setEditing(null); setView('list'); }
    if (recapMatch && recapMatch.id===m.id) { setRecapMatch(null); setView('list'); }
  }
  function startLive(m) {
    const liveMatch = { ...m, status:'live', lineup: ensureLineupArray(m) };
    setEditing(liveMatch);
    setView('live');
  }
  function endLive() {
    const finalMatch = { ...editing, status:'done' };
    setMatches(prev => {
      const idx = prev.findIndex(m => m.id === finalMatch.id);
      if (idx >= 0) { const copy=[...prev]; copy[idx]=finalMatch; return copy; }
      return [...prev, finalMatch];
    });
    setRecapMatch(finalMatch); setEditing(null); setView('recap');
    showToast('Match terminé !', 'success');
  }

  if (view === 'recap' && recapMatch) {
    const fresh = matches.find(m => m.id === recapMatch.id) || recapMatch;
    return <MatchRecap match={fresh} players={players} T={T}
      onBack={()=>{ setRecapMatch(null); setView('list'); }}
      onEdit={()=>startEdit(fresh)}
      onDelete={()=>setConfirmDelete(fresh)}
      confirmDelete={confirmDelete} setConfirmDelete={setConfirmDelete} deleteMatch={deleteMatch}/>;
  }

  if (view === 'edit' && editing) {
    return <MatchEditor match={editing} setMatch={setEditing}
      onSave={saveMatch}
      onCancel={()=>{
        if (recapMatch) { setView('recap'); } else { setView('list'); }
        setEditing(null);
      }}
      onDelete={()=>setConfirmDelete(editing)}
      onLive={()=>{ saveMatch(); startLive(editing); }}
      players={players} T={T}
      matchPresets={matchPresets} setMatchPresets={setMatchPresets}
      showToast={showToast}
      confirmDelete={confirmDelete} setConfirmDelete={setConfirmDelete} deleteMatch={deleteMatch}/>;
  }

  if (view === 'live' && editing) {
    return <MatchLive match={editing} setMatch={setEditing} players={players} onEnd={endLive} onCancel={()=>setView('list')} T={T}/>;
  }

  return (
    <PageContainer>
      <PageHeader title="Matchs" subtitle={`${matches.length} match(s) au total`}
        action={<Btn icon="plus" onClick={startNew}>Nouveau match</Btn>}/>

      <Tabs tabs={['À venir','Terminés','Tous']} active={tabs} onChange={setTabs} style={{ marginBottom:16 }}/>

      {filteredMatches.length === 0 ? (
        <Card>
          <EmptyState icon="ball" title="Aucun match"
            message={tabs===0?"Planifie ton prochain match":"Pas encore d'historique"}
            action={tabs===0 && <Btn onClick={startNew} icon="plus">Créer un match</Btn>}/>
        </Card>
      ) : (
        <div style={{ display:'grid', gap:12 }}>
          {filteredMatches.map(m => (
            <MatchListCard key={m.id} match={m} players={players} T={T}
              onClick={()=>openMatch(m)}
              onLive={()=>startLive(m)}/>
          ))}
        </div>
      )}

      <ConfirmDialog open={!!confirmDelete} title="Supprimer ce match ?"
        message="Cette action est irréversible."
        onConfirm={()=>deleteMatch(confirmDelete)} onCancel={()=>setConfirmDelete(null)}/>
    </PageContainer>
  );
}

/* ============================================================
   MATCH LIST CARD (carte enrichie pour la liste des matchs)
============================================================ */
function MatchListCard({ match: m, players, T, onClick, onLive }) {
  const mt = MATCH_TYPES.find(t=>t.id===m.type);
  const isDone = m.status === 'done';
  const isLive = m.status === 'live';
  const result = isDone ? (m.score.us > m.score.them ? 'V' : (m.score.us < m.score.them ? 'D' : 'N')) : null;
  const resultColor = result==='V' ? T.success : result==='D' ? T.danger : (result==='N' ? T.warning : T.info);

  const topScorers = useMemo(() => {
    if (!isDone) return [];
    const goals = {};
    (m.events||[]).filter(ev => ev.type === 'goal' && ev.playerId).forEach(ev => {
      goals[ev.playerId] = (goals[ev.playerId]||0) + 1;
    });
    return Object.entries(goals)
      .sort((a,b) => b[1]-a[1])
      .slice(0, 3)
      .map(([pid, n]) => ({ player: players.find(p => p.id === pid), goals:n }))
      .filter(x => x.player);
  }, [isDone, m.events, players]);

  const daysUntil = useMemo(() => {
    if (isDone || isLive) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const mDate = new Date(m.date); mDate.setHours(0,0,0,0);
    return Math.round((mDate - today) / 86400000);
  }, [isDone, isLive, m.date]);

  const lineupCount = (m.lineup || []).filter(Boolean).length;

  return (
    <Card padding={0} hoverable onClick={onClick} style={{ overflow:'hidden' }}>
      <div style={{ height:4, background: isDone ? resultColor : (isLive ? T.danger : mt.color) }}/>
      <div style={{ padding:'14px 16px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>
          {isDone ? (
            <div style={{
              width:68, padding:'8px 4px', borderRadius:12,
              background: resultColor, color:'#fff', textAlign:'center', flexShrink:0,
            }}>
              <div style={{ fontSize:10, fontWeight:700, opacity:0.9, letterSpacing:0.4 }}>{result==='V'?'VICTOIRE':result==='D'?'DÉFAITE':'NUL'}</div>
              <div style={{ fontSize:22, fontWeight:800, lineHeight:1, fontVariantNumeric:'tabular-nums', marginTop:3 }}>{m.score.us}–{m.score.them}</div>
            </div>
          ) : (
            <div style={{
              width:68, padding:'8px 4px', borderRadius:12,
              background: (isLive?T.danger:mt.color)+'18',
              color: isLive?T.danger:mt.color, textAlign:'center', flexShrink:0,
              border:`1px solid ${(isLive?T.danger:mt.color)}40`,
            }}>
              <div style={{ fontSize:22, fontWeight:800, lineHeight:1, fontVariantNumeric:'tabular-nums' }}>{new Date(m.date).getDate()}</div>
              <div style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', marginTop:3, letterSpacing:0.3 }}>{new Date(m.date).toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</div>
            </div>
          )}
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:5, flexWrap:'wrap' }}>
              <Badge bg={mt.color+'1F'} color={mt.color}>{mt.label}</Badge>
              <Badge bg={T.card3} color={T.text2}><Icon name="pin" size={10}/> {m.domicile?'Domicile':'Extérieur'}</Badge>
              {isLive && <Badge bg={T.dangerLight} color={T.danger}><span className="pulse" style={{ display:'inline-flex' }}><Icon name="dot" size={10} color={T.danger}/></span> LIVE</Badge>}
              {!isDone && !isLive && daysUntil !== null && (
                <Badge bg={daysUntil<=2?T.warningLight:T.card3} color={daysUntil<=2?T.warning:T.text2}>
                  {daysUntil === 0 ? "Aujourd'hui" : daysUntil === 1 ? 'Demain' : daysUntil > 1 ? `J-${daysUntil}` : `J+${-daysUntil}`}
                </Badge>
              )}
            </div>
            <div style={{ fontSize:16, fontWeight:800, color:T.text, letterSpacing:-0.2, lineHeight:1.2 }}>
              {isDone ? (
                <span>RLFC <span style={{ color:resultColor }}>{m.score.us}</span><span style={{ color:T.text3, padding:'0 4px' }}>–</span><span style={{ color:result==='D'?resultColor:T.text }}>{m.score.them}</span> {m.opponent || 'Adv.'}</span>
              ) : (
                <span>vs {m.opponent || 'Adversaire'}</span>
              )}
            </div>
            <div style={{ fontSize:12, color:T.text2, marginTop:4, display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
              <Icon name="clock" size={11} color={T.text2}/>{m.time}
              {m.location && (<><span style={{ color:T.text3 }}>·</span><Icon name="pin" size={11} color={T.text2}/>{m.location}</>)}
              {!isDone && lineupCount > 0 && (<><span style={{ color:T.text3 }}>·</span><Icon name="users" size={11} color={T.text2}/>{lineupCount}/8 titulaires</>)}
            </div>
          </div>
          {!isDone && !isLive && (
            <IconBtn icon="play" title="Lancer le match"
              bg={T.success+'18'} color={T.success}
              onClick={(e)=>{ e.stopPropagation(); onLive(); }}/>
          )}
          {isDone && <Icon name="chevronRight" size={18} color={T.text3}/>}
        </div>
        {isDone && topScorers.length > 0 && (
          <div style={{
            marginTop:10, paddingTop:10, borderTop:`1px solid ${T.border}`,
            display:'flex', flexWrap:'wrap', gap:6, alignItems:'center',
          }}>
            <Icon name="ball" size={12} color={T.text2}/>
            {topScorers.map(({ player, goals }) => (
              <span key={player.id} style={{
                display:'inline-flex', alignItems:'center', gap:4,
                padding:'3px 9px', borderRadius:999, background:T.card2,
                fontSize:11, fontWeight:600, color:T.text,
                border:`1px solid ${T.border}`,
              }}>
                {player.firstName} {player.lastName ? player.lastName[0]+'.' : ''}
                {goals > 1 && <span style={{ color:T.text2, fontWeight:700 }}>×{goals}</span>}
              </span>
            ))}
          </div>
        )}
      </div>
    </Card>
  );
}

/* ====================================================
   MATCH EDITOR (préparation)
============================================================ */
function MatchEditor({ match, setMatch, onSave, onCancel, onDelete, onLive, players, T, matchPresets, setMatchPresets, showToast, confirmDelete, setConfirmDelete, deleteMatch }) {
  const [tab, setTab] = useState(0);
  const [selectedPid, setSelectedPid] = useState(null); // joueur sélectionné pour placement

  // Ensure lineup is positional array
  const lineup = useMemo(() => ensureLineupArray(match), [match.lineup, match.formation]);
  const form = useMemo(() => getFormation(match.formation), [match.formation]);
  const lineupSet = useMemo(() => new Set(lineupPids(lineup)), [lineup]);

  // Re-sync lineup if formation changed (preserve players, push extras to bench)
  useEffect(() => {
    const N = form.slots.length;
    if ((match.lineup||[]).length !== N) {
      const old = match.lineup || [];
      const newLineup = Array(N).fill(null);
      // copy players up to N
      for (let i = 0; i < Math.min(old.length, N); i++) newLineup[i] = old[i] || null;
      // push extras to bench
      const extras = old.slice(N).filter(Boolean);
      const newBench = [...(match.bench||[]), ...extras.filter(p => !(match.bench||[]).includes(p))];
      setMatch({ ...match, lineup: newLineup, bench: newBench });
    }
  }, [match.formation]);

  // Lists derived
  const available = players.filter(p =>
    !lineupSet.has(p.id) && !match.bench.includes(p.id) && !match.absent.includes(p.id)
  );
  const benchPlayers = match.bench.map(pid => players.find(p => p.id === pid)).filter(Boolean);
  const absentPlayers = match.absent.map(pid => players.find(p => p.id === pid)).filter(Boolean);
  const lineupCount = lineupPids(lineup).length;

  // ====== Tap-to-place logic ======
  function slotClick(idx) {
    const currentPid = lineup[idx];
    // Case 1: no selection AND slot empty → nothing
    if (!selectedPid && !currentPid) return;
    // Case 2: no selection AND slot has player → select that player (allows move/remove)
    if (!selectedPid && currentPid) {
      setSelectedPid(currentPid);
      return;
    }
    // Case 3: selection AND slot empty → place selected player
    if (selectedPid && !currentPid) {
      // remove from wherever it is, place in slot
      const newLineup = clearPidFromLineup(lineup, selectedPid);
      newLineup[idx] = selectedPid;
      const newBench = match.bench.filter(x => x !== selectedPid);
      const newAbsent = match.absent.filter(x => x !== selectedPid);
      setMatch({ ...match, lineup: newLineup, bench: newBench, absent: newAbsent });
      setSelectedPid(null);
      return;
    }
    // Case 4: selection AND slot has player
    if (selectedPid && currentPid) {
      if (selectedPid === currentPid) {
        // tap self → deselect
        setSelectedPid(null);
        return;
      }
      // Swap: find selectedPid's current slot (or it might be from bench/available)
      const selectedSlotIdx = lineup.findIndex(p => p === selectedPid);
      const newLineup = [...lineup];
      if (selectedSlotIdx >= 0) {
        // Swap on field
        newLineup[selectedSlotIdx] = currentPid;
        newLineup[idx] = selectedPid;
        setMatch({ ...match, lineup: newLineup });
      } else {
        // selected is from bench/available, currentPid (on field) gets bumped to bench
        newLineup[idx] = selectedPid;
        const newBench = match.bench.filter(x => x !== selectedPid);
        if (!newBench.includes(currentPid)) newBench.push(currentPid);
        const newAbsent = match.absent.filter(x => x !== selectedPid);
        setMatch({ ...match, lineup: newLineup, bench: newBench, absent: newAbsent });
      }
      setSelectedPid(null);
    }
  }

  function selectPlayer(pid) {
    setSelectedPid(prev => prev === pid ? null : pid);
  }

  function sendToBench(pid) {
    const newLineup = clearPidFromLineup(lineup, pid);
    const newBench = match.bench.includes(pid) ? match.bench : [...match.bench, pid];
    const newAbsent = match.absent.filter(x => x !== pid);
    setMatch({ ...match, lineup: newLineup, bench: newBench, absent: newAbsent });
    setSelectedPid(null);
  }
  function sendToAbsent(pid) {
    const newLineup = clearPidFromLineup(lineup, pid);
    const newBench = match.bench.filter(x => x !== pid);
    const newAbsent = match.absent.includes(pid) ? match.absent : [...match.absent, pid];
    setMatch({ ...match, lineup: newLineup, bench: newBench, absent: newAbsent });
    setSelectedPid(null);
  }
  function sendToAvailable(pid) {
    const newLineup = clearPidFromLineup(lineup, pid);
    const newBench = match.bench.filter(x => x !== pid);
    const newAbsent = match.absent.filter(x => x !== pid);
    setMatch({ ...match, lineup: newLineup, bench: newBench, absent: newAbsent });
    setSelectedPid(null);
  }

  function clearAll() {
    setMatch({ ...match, lineup: Array(form.slots.length).fill(null) });
    setSelectedPid(null);
  }
  function doAutoCompose() {
    setMatch(autoCompose(match, players));
    setSelectedPid(null);
  }

  return (
    <PageContainer>
      {/* HEADER */}
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:16, flexWrap:'wrap' }}>
        <IconBtn icon="arrowLeft" onClick={onCancel}/>
        <h1 style={{ fontSize:22, fontWeight:800, color:T.text, margin:0, flex:1, minWidth:200, letterSpacing:-0.3 }}>
          {match.opponent ? `vs ${match.opponent}` : 'Nouveau match'}
        </h1>
        <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
        <Btn variant="primary" icon="check" onClick={onSave}>Enregistrer</Btn>
        {match.status === 'prepared' && lineupCount >= 1 && (
          <Btn variant="success" icon="play" onClick={onLive}>Lancer</Btn>
        )}
      </div>

      <Tabs tabs={['Infos','Composition','Notes']} active={tab} onChange={setTab} style={{ marginBottom:16 }}/>

      {tab === 0 && (
        <div style={{ display:'grid', gap:14 }}>
          {/* Bloc 1: MATCH */}
          <Card padding={18}>
            <SectionTitle>Match</SectionTitle>
            <div style={{ display:'grid', gap:14 }}>
              <Input label="Adversaire" value={match.opponent} onChange={v=>setMatch({...match, opponent:v})}
                icon="users" placeholder="RSC Anderlecht U12"/>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))', gap:12 }}>
                <Select label="Type" value={match.type} onChange={v=>setMatch({...match, type:v})}
                  options={MATCH_TYPES.map(t=>({value:t.id,label:t.label,dot:true,color:t.color}))} placeholder=""/>
                <Select label="Durée totale" value={String(match.duration)} onChange={v=>setMatch({...match, duration:Number(v)})}
                  options={MATCH_DURATIONS.map(d=>({value:String(d.id),label:d.label}))} placeholder=""/>
                <Select label="Formation tactique" value={match.formation} onChange={v=>setMatch({...match, formation:v})}
                  options={FORMATIONS_8V8.map(f=>({value:f.id, label:f.label, sub:f.desc}))} placeholder=""/>
              </div>
            </div>
          </Card>

          {/* Bloc 2: HORAIRES */}
          <Card padding={18}>
            <SectionTitle>Horaires</SectionTitle>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))', gap:12 }}>
              <Input label="Date du match" type="date" value={match.date} onChange={v=>setMatch({...match, date:v})}/>
              <Input label="Coup d'envoi" type="time" value={match.time} onChange={v=>setMatch({...match, time:v})}/>
              <Input label="Rendez-vous équipe" type="time" value={match.arrivalTime}
                onChange={v=>setMatch({...match, arrivalTime:v})}
                suffix={match.time && match.arrivalTime ? `(${(() => {
                  const [h,m] = match.time.split(':').map(Number);
                  const [ah,am] = match.arrivalTime.split(':').map(Number);
                  const diff = (h*60+m) - (ah*60+am);
                  return diff > 0 ? `${Math.floor(diff/60)}h${String(diff%60).padStart(2,'0')} avant` : '';
                })()})` : ''}/>
            </div>
            <div style={{ marginTop:12 }}>
              <Input label="Lieu de RDV (si différent du terrain)" value={match.meetingPoint}
                onChange={v=>setMatch({...match, meetingPoint:v})}
                icon="pin" placeholder="Parking du stade, vestiaire..."/>
            </div>
          </Card>

          {/* Bloc 3: LIEU */}
          <Card padding={18}>
            <SectionTitle>Lieu</SectionTitle>
            <div style={{ display:'grid', gap:12 }}>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                <Select label="Domicile / Extérieur" value={match.domicile?'home':'away'}
                  onChange={v=>setMatch({...match, domicile:v==='home'})}
                  options={[{value:'home',label:'Domicile',icon:'home'},{value:'away',label:'Extérieur',icon:'pin'}]} placeholder=""/>
                {match.domicile ? (
                  <Select label="Terrain" value={match.location} onChange={v=>setMatch({...match, location:v})}
                    options={[{value:'',label:'Non défini'}, ...LOCATIONS.map(l=>({ value:l, label:l, icon:'pin' }))]} placeholder=""/>
                ) : (
                  <Input label="Stade / Lieu" value={match.location}
                    onChange={v=>setMatch({...match, location:v})}
                    icon="pin" placeholder="Stade Vincent Van Den Eeden"/>
                )}
              </div>
              <Input label="Adresse complète" value={match.address}
                onChange={v=>setMatch({...match, address:v})}
                icon="pin" placeholder="Rue de la Vallée 28, 1180 Uccle"/>
            </div>
          </Card>

          {/* Bloc 4: ÉQUIPEMENT & ARBITRE */}
          <Card padding={18}>
            <SectionTitle>Équipement & arbitre</SectionTitle>
            <div style={{ display:'grid', gap:12 }}>
              <Select label="Maillot à porter" value={match.kitColor || 'home'}
                onChange={v=>setMatch({...match, kitColor:v})}
                options={KIT_COLORS.map(k=>({value:k.id, label:k.label, dot:true, color:k.color}))} placeholder=""/>
              <Input label="Arbitre prévu" value={match.referee}
                onChange={v=>setMatch({...match, referee:v})}
                placeholder="Nom de l'arbitre (si connu)"/>
              <Select label="Météo prévue" value={match.weather}
                onChange={v=>setMatch({...match, weather:v})}
                options={[{value:'',label:'Non renseignée'}, ...WEATHER_OPTIONS.map(w=>({value:w.id, label:w.label, icon:w.icon}))]} placeholder=""/>
            </div>
          </Card>

          {/* Bloc 5: CONTACT */}
          <Card padding={18}>
            <SectionTitle>Contact</SectionTitle>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
              <Input label="Nom du contact" value={match.contactName}
                onChange={v=>setMatch({...match, contactName:v})}
                icon="user" placeholder="Responsable terrain, dirigeant..."/>
              <Input label="Téléphone" value={match.contactPhone}
                onChange={v=>setMatch({...match, contactPhone:v})}
                type="tel" placeholder="+32 ..."/>
            </div>
          </Card>

          {/* Bloc 6: TRANSPORT & INSTRUCTIONS */}
          <Card padding={18}>
            <SectionTitle>Transport & instructions</SectionTitle>
            <div style={{ display:'grid', gap:12 }}>
              <Textarea label="Transport / Co-voiturage" value={match.transport}
                onChange={v=>setMatch({...match, transport:v})} rows={2}
                placeholder="Bus du club à 13h, co-voiturage parents..."/>
              <Textarea label="Instructions spéciales" value={match.specialInstructions}
                onChange={v=>setMatch({...match, specialInstructions:v})} rows={3}
                placeholder="Équipement particulier, allergies, médicaments, etc."/>
            </div>
          </Card>
        </div>
      )}

      {tab === 1 && (
        <CompositionView
          match={match} setMatch={setMatch} lineup={lineup} form={form} players={players} T={T}
          available={available} benchPlayers={benchPlayers} absentPlayers={absentPlayers}
          lineupCount={lineupCount}
          selectedPid={selectedPid} setSelectedPid={selectPlayer}
          slotClick={slotClick}
          sendToBench={sendToBench} sendToAbsent={sendToAbsent} sendToAvailable={sendToAvailable}
          clearAll={clearAll} doAutoCompose={doAutoCompose}
          onFormationChange={(f)=>setMatch({...match, formation:f})}
          matchPresets={matchPresets} setMatchPresets={setMatchPresets}
          showToast={showToast}/>
      )}

      {tab === 2 && (
        <Card padding={18}>
          <SectionTitle>Notes & consignes</SectionTitle>
          <Textarea value={match.notes} onChange={v=>setMatch({...match, notes:v})}
            placeholder="Consignes tactiques, infos sur l'adversaire, dispositions particulières..." rows={8}/>
        </Card>
      )}

      <ConfirmDialog open={!!confirmDelete} title="Supprimer ce match ?"
        message="Cette action est irréversible."
        onConfirm={()=>deleteMatch(confirmDelete)} onCancel={()=>setConfirmDelete(null)}/>

      {match.status !== 'done' && (
        <div style={{ marginTop:16, textAlign:'center' }}>
          <Btn variant="danger" icon="trash" onClick={()=>setConfirmDelete(match)}>Supprimer ce match</Btn>
        </div>
      )}
    </PageContainer>
  );
}

/* ============================================================
   COMPOSITION VIEW (tap-to-place tablet-friendly)
============================================================ */
function CompositionView({ match, setMatch, lineup, form, players, T, available, benchPlayers, absentPlayers, lineupCount, selectedPid, setSelectedPid, slotClick, sendToBench, sendToAbsent, sendToAvailable, clearAll, doAutoCompose, onFormationChange, matchPresets, setMatchPresets, showToast }) {
  const [presetModal, setPresetModal] = useState(false);
  const [saveModal, setSaveModal] = useState(false);
  const [presetName, setPresetName] = useState('');

  const selectedPlayer = selectedPid ? players.find(p => p.id === selectedPid) : null;
  const selectedLocation = selectedPid
    ? (lineup.includes(selectedPid) ? 'lineup'
      : match.bench.includes(selectedPid) ? 'bench'
      : match.absent.includes(selectedPid) ? 'absent'
      : 'available')
    : null;

  function saveCurrentAsPreset() {
    if (!presetName.trim()) return;
    const preset = {
      id: uid(),
      name: presetName.trim(),
      formation: match.formation,
      lineup: [...lineup], // copy sparse array of pids
      bench: [...(match.bench||[])],
      createdAt: nowMs(),
    };
    setMatchPresets([...(matchPresets||[]), preset]);
    setSaveModal(false);
    setPresetName('');
    showToast && showToast(`Compo "${preset.name}" sauvegardée`, 'success');
  }
  function applyPreset(preset) {
    // Filter pids that still exist in players list
    const validPids = new Set(players.map(p => p.id));
    const newLineup = (preset.lineup || []).map(pid => validPids.has(pid) ? pid : null);
    const newBench = (preset.bench || []).filter(pid => validPids.has(pid));
    // Adjust to current formation length if different
    const targetForm = getFormation(preset.formation);
    const sameFormation = preset.formation === match.formation;
    if (sameFormation) {
      setMatch({ ...match, lineup: newLineup, bench: newBench, absent: [] });
    } else {
      // change formation too
      setMatch({ ...match, formation: preset.formation, lineup: newLineup, bench: newBench, absent: [] });
    }
    setPresetModal(false);
    showToast && showToast(`Compo "${preset.name}" appliquée`, 'success');
  }
  function deletePreset(presetId) {
    setMatchPresets((matchPresets||[]).filter(p => p.id !== presetId));
  }

  return (
    <div>
      {/* HEADER STATS + ACTIONS */}
      <Card padding={12} style={{ marginBottom:14 }}>
        {/* Mini-stats avec barre de progression */}
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10, flexWrap:'wrap' }}>
          <div style={{ flex:1, minWidth:140 }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 }}>
              <span style={{ fontSize:11, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.5 }}>Titulaires</span>
              <span style={{
                fontSize:13, fontWeight:800, fontVariantNumeric:'tabular-nums',
                color: lineupCount===8 ? T.success : (lineupCount>0 ? T.warning : T.text3),
              }}>{lineupCount}/8</span>
            </div>
            <div style={{ width:'100%', height:6, borderRadius:3, background:T.card3, overflow:'hidden' }}>
              <div style={{
                width:`${(lineupCount/8)*100}%`, height:'100%',
                background: lineupCount===8 ? T.success : T.warning,
                transition:'width 0.25s',
              }}/>
            </div>
          </div>
          <div style={{ display:'flex', gap:6 }}>
            <div style={{
              padding:'6px 10px', borderRadius:8,
              background:T.warningLight, color:T.warning,
              fontSize:11, fontWeight:700, display:'flex', alignItems:'center', gap:5,
            }}>
              <Icon name="clipboard" size={11}/>{match.bench.length} banc
            </div>
            <div style={{
              padding:'6px 10px', borderRadius:8,
              background: match.absent.length>0 ? T.dangerLight : T.card3,
              color: match.absent.length>0 ? T.danger : T.text2,
              fontSize:11, fontWeight:700, display:'flex', alignItems:'center', gap:5,
            }}>
              <Icon name="close" size={11}/>{match.absent.length} abs.
            </div>
          </div>
        </div>

        {/* Action bar */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))', gap:6, paddingTop:10, borderTop:`1px solid ${T.border}` }}>
          <Btn size="sm" variant="secondary" icon="bookOpen" onClick={()=>setPresetModal(true)}
            title="Charger une compo préfaite">Charger {(matchPresets||[]).length>0?`(${(matchPresets||[]).length})`:''}</Btn>
          <Btn size="sm" variant="secondary" icon="star" onClick={()=>{ setPresetName(''); setSaveModal(true); }}
            disabled={lineupCount===0} title="Sauvegarder la compo actuelle">Sauver</Btn>
          <Btn size="sm" variant="secondary" icon="refresh" onClick={doAutoCompose}
            title="Auto-compo selon les postes">Auto-compo</Btn>
          <Btn size="sm" variant="ghost" icon="trash" onClick={clearAll}
            disabled={lineupCount===0} title="Vider tous les titulaires">Vider</Btn>
        </div>
      </Card>

      {/* PRESETS MODAL */}
      <Modal open={presetModal} onClose={()=>setPresetModal(false)} title="Compositions sauvegardées" width={520}
        footer={<Btn variant="primary" onClick={()=>setPresetModal(false)}>Fermer</Btn>}>
        {(matchPresets||[]).length === 0 ? (
          <EmptyState icon="bookOpen" title="Aucune compo sauvegardée"
            message="Crée une compo puis utilise le bouton « Sauver » pour la réutiliser sur d'autres matchs."/>
        ) : (
          <div style={{ display:'grid', gap:8 }}>
            {(matchPresets||[]).map(preset => {
              const presetLineupCount = (preset.lineup||[]).filter(Boolean).length;
              const validPids = new Set(players.map(p => p.id));
              const missingCount = (preset.lineup||[]).filter(pid => pid && !validPids.has(pid)).length;
              return (
                <div key={preset.id} style={{
                  padding:'12px 14px', background:T.card2, borderRadius:10,
                  border:`1px solid ${T.border}`,
                  display:'flex', alignItems:'center', gap:10,
                }}>
                  <div style={{
                    width:42, height:42, borderRadius:10,
                    background:T.accent+'18', color:T.accent,
                    display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
                  }}><Icon name="bookOpen" size={20}/></div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:14, fontWeight:700, color:T.text }}>{preset.name}</div>
                    <div style={{ fontSize:11, color:T.text2, marginTop:2 }}>
                      Formation {preset.formation} · {presetLineupCount}/8 titulaires · {(preset.bench||[]).length} banc
                      {missingCount > 0 && <span style={{ color:T.warning }}> · ⚠ {missingCount} joueur(s) manquant(s)</span>}
                    </div>
                  </div>
                  <Btn size="sm" variant="primary" icon="check" onClick={()=>applyPreset(preset)}>Charger</Btn>
                  <IconBtn icon="trash" size={32} variant="danger"
                    onClick={()=>{
                      if (confirm(`Supprimer la compo "${preset.name}" ?`)) deletePreset(preset.id);
                    }}/>
                </div>
              );
            })}
          </div>
        )}
      </Modal>

      {/* SAVE PRESET MODAL */}
      <Modal open={saveModal} onClose={()=>setSaveModal(false)} title="Sauvegarder cette composition" width={460}
        footer={<>
          <Btn variant="ghost" onClick={()=>setSaveModal(false)}>Annuler</Btn>
          <Btn variant="primary" icon="check" onClick={saveCurrentAsPreset} disabled={!presetName.trim()}>Sauvegarder</Btn>
        </>}>
        <div style={{ display:'grid', gap:14 }}>
          <Input label="Nom de la compo" value={presetName} onChange={setPresetName}
            placeholder="Ex: Compo championnat, Compo défensive..." autoFocus icon="star"/>
          <div style={{ padding:12, background:T.card2, borderRadius:9, border:`1px solid ${T.border}` }}>
            <div style={{ fontSize:11, fontWeight:700, color:T.text2, textTransform:'uppercase', marginBottom:6 }}>Aperçu</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              <Badge bg={T.accentLight} color={T.accent}>Formation {match.formation}</Badge>
              <Badge bg={T.success+'18'} color={T.success}>{lineupCount} titulaires</Badge>
              <Badge bg={T.warningLight} color={T.warning}>{(match.bench||[]).length} banc</Badge>
            </div>
          </div>
        </div>
      </Modal>

      {/* SELECTED PLAYER BANNER */}
      {selectedPlayer && (
        <Card padding={12} style={{ marginBottom:14, borderColor:T.accent, background:T.accentLight }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <Avatar name={`${selectedPlayer.firstName} ${selectedPlayer.lastName}`} size={36} color={POSITIONS.find(x=>x.id===selectedPlayer.position)?.color}/>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:13, fontWeight:700, color:T.text }}>
                #{selectedPlayer.number||'?'} {selectedPlayer.firstName} {selectedPlayer.lastName}
              </div>
              <div style={{ fontSize:11, color:T.accent, fontWeight:600 }}>
                Tape une case du terrain pour le placer
              </div>
            </div>
            <Btn size="sm" variant="ghost" onClick={()=>setSelectedPid(selectedPid)}>Annuler</Btn>
          </div>
          {/* Quick action buttons */}
          <div style={{ display:'flex', gap:6, marginTop:10 }}>
            <Btn size="sm" variant={selectedLocation==='lineup'?'secondary':'ghost'} fullWidth disabled={selectedLocation==='available'} onClick={()=>sendToAvailable(selectedPid)} icon="users">Disponibles</Btn>
            <Btn size="sm" variant={selectedLocation==='bench'?'warning':'ghost'} fullWidth disabled={selectedLocation==='bench'} onClick={()=>sendToBench(selectedPid)} icon="clipboard">Banc</Btn>
            <Btn size="sm" variant={selectedLocation==='absent'?'danger':'ghost'} fullWidth disabled={selectedLocation==='absent'} onClick={()=>sendToAbsent(selectedPid)} icon="close">Absent</Btn>
          </div>
        </Card>
      )}

      {/* FORMATION FIELD (interactive) */}
      <Card padding={14} style={{ marginBottom:14 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12, flexWrap:'wrap' }}>
          <div style={{
            display:'inline-flex', alignItems:'center', gap:6,
            padding:'4px 11px', borderRadius:7,
            background:T.accent+'15', color:T.accent,
            fontSize:12, fontWeight:700, letterSpacing:0.2,
          }}>
            <Icon name="brain" size={13}/>
            {form.label}
          </div>
          <div style={{ fontSize:11, color:T.text3, fontWeight:600, fontStyle:'italic' }}>
            {form.desc}
          </div>
        </div>
        <InteractiveField
          form={form} lineup={lineup} players={players} T={T}
          selectedPid={selectedPid} onSlotClick={slotClick}/>
        <div style={{ marginTop:10, padding:'8px 12px', background:selectedPid?T.accentLight:T.card2, borderRadius:8, fontSize:11.5, color:selectedPid?T.accent:T.text2, textAlign:'center', lineHeight:1.4, transition:'all 0.15s', display:'flex', alignItems:'center', justifyContent:'center', gap:6 }}>
          {selectedPid ? (
            <><Icon name="info" size={12}/><strong>Tape une case</strong> pour placer le joueur sélectionné</>
          ) : (
            <><Icon name="info" size={12}/>Tape un joueur, puis tape une case du terrain</>
          )}
        </div>
      </Card>

      {/* PLAYER LISTS */}
      {players.length === 0 ? (
        <Card>
          <EmptyState icon="users" title="Aucun joueur" message="Ajoute des joueurs dans Groupe"/>
        </Card>
      ) : (
        <Card padding={14}>
          <PlayerListSection title="Disponibles" subtitle="Pas encore affectés" icon="users"
            players={available} T={T} colorKey="info"
            selectedPid={selectedPid} onPlayerClick={setSelectedPid}
            emptyText="Tous les joueurs sont affectés"/>

          <div style={{ height:1, background:T.border, margin:'14px 0' }}/>

          <PlayerListSection title="Banc" subtitle="Remplaçants pendant le match" icon="clipboard"
            players={benchPlayers} T={T} colorKey="warning"
            selectedPid={selectedPid} onPlayerClick={setSelectedPid}
            emptyText="Aucun remplaçant"/>

          <div style={{ height:1, background:T.border, margin:'14px 0' }}/>

          <PlayerListSection title="Absents" subtitle="Non disponibles pour ce match" icon="close"
            players={absentPlayers} T={T} colorKey="danger"
            selectedPid={selectedPid} onPlayerClick={setSelectedPid}
            emptyText="Tous les joueurs sont disponibles"/>
        </Card>
      )}
    </div>
  );
}

function PlayerListSection({ title, subtitle, icon, players, T, colorKey, selectedPid, onPlayerClick, emptyText }) {
  const color = T[colorKey];
  return (
    <div>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
        <div style={{
          width:28, height:28, borderRadius:8,
          background: color+'1F', color,
          display:'flex', alignItems:'center', justifyContent:'center',
        }}><Icon name={icon} size={15}/></div>
        <div>
          <div style={{ fontSize:13, fontWeight:700, color:T.text }}>{title} <span style={{ color:T.text2, fontWeight:600 }}>({players.length})</span></div>
          <div style={{ fontSize:10.5, color:T.text2 }}>{subtitle}</div>
        </div>
      </div>
      {players.length === 0 ? (
        <div style={{ padding:'12px 14px', background:T.card2, borderRadius:8, fontSize:12, color:T.text3, textAlign:'center', fontStyle:'italic' }}>
          {emptyText}
        </div>
      ) : (
        <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
          {players.map(p => {
            const isSelected = selectedPid === p.id;
            const pos = POSITIONS.find(x => x.id === p.position);
            return (
              <button key={p.id} onClick={()=>onPlayerClick(p.id)}
                style={{
                  display:'flex', alignItems:'center', gap:7,
                  padding:'5px 12px 5px 5px',
                  background: isSelected ? T.accent : T.card2,
                  color: isSelected ? '#fff' : T.text,
                  border:`1.5px solid ${isSelected ? T.accent : T.border}`,
                  borderRadius:999, cursor:'pointer',
                  transition:'all 0.12s',
                  fontWeight:600,
                }}>
                <Avatar name={`${p.firstName} ${p.lastName}`} size={26} color={pos?.color}/>
                <span style={{ fontSize:12 }}>
                  #{p.number||'?'} {p.lastName || p.firstName}
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   INTERACTIVE FIELD (tap-to-place)
============================================================ */
function InteractiveField({ form, lineup, players, T, selectedPid, onSlotClick, compact=false }) {
  /* HORIZONTAL field — own goal LEFT, attack RIGHT
     Proportions adaptées au format papier (paysage 8v8 ratio ~3:2)
  */
  const maxW = compact ? 380 : 460;
  return (
    <div style={{
      position:'relative', width:'100%',
      paddingBottom:'62%',
      maxWidth: maxW, margin:'0 auto',
      background:`
        radial-gradient(ellipse at center, rgba(255,255,255,0.04) 0%, transparent 70%),
        linear-gradient(90deg, #0c5e2f 0%, #0f7842 50%, #0c5e2f 100%)
      `,
      borderRadius:14, overflow:'hidden',
      boxShadow: T.shadowMd + ', inset 0 0 0 1px rgba(255,255,255,0.05)',
      userSelect:'none', WebkitTapHighlightColor:'transparent',
    }}>
      {/* Stripes effect for grass */}
      <div style={{
        position:'absolute', inset:0,
        background:'repeating-linear-gradient(90deg, rgba(255,255,255,0.018) 0 8%, transparent 8% 16%)',
        pointerEvents:'none',
      }}/>

      {/* Field markings - horizontal */}
      <div style={{ position:'absolute', inset:0 }}>
        <svg viewBox="0 0 100 60" width="100%" height="100%" preserveAspectRatio="none">
          <rect x="2" y="2" width="96" height="56" fill="none" stroke="rgba(255,255,255,0.55)" strokeWidth="0.35"/>
          <line x1="50" y1="2" x2="50" y2="58" stroke="rgba(255,255,255,0.55)" strokeWidth="0.35"/>
          <circle cx="50" cy="30" r="7" fill="none" stroke="rgba(255,255,255,0.55)" strokeWidth="0.35"/>
          <circle cx="50" cy="30" r="0.8" fill="rgba(255,255,255,0.7)"/>
          {/* Left penalty box */}
          <rect x="2" y="18" width="11" height="24" fill="none" stroke="rgba(255,255,255,0.55)" strokeWidth="0.35"/>
          <rect x="2" y="24" width="4" height="12" fill="none" stroke="rgba(255,255,255,0.55)" strokeWidth="0.35"/>
          <circle cx="9" cy="30" r="0.7" fill="rgba(255,255,255,0.7)"/>
          {/* Left goal posts */}
          <line x1="2" y1="26" x2="2" y2="34" stroke="rgba(255,255,255,0.85)" strokeWidth="0.7"/>
          {/* Right penalty box */}
          <rect x="87" y="18" width="11" height="24" fill="none" stroke="rgba(255,255,255,0.55)" strokeWidth="0.35"/>
          <rect x="94" y="24" width="4" height="12" fill="none" stroke="rgba(255,255,255,0.55)" strokeWidth="0.35"/>
          <circle cx="91" cy="30" r="0.7" fill="rgba(255,255,255,0.7)"/>
          {/* Right goal posts */}
          <line x1="98" y1="26" x2="98" y2="34" stroke="rgba(255,255,255,0.85)" strokeWidth="0.7"/>
        </svg>
      </div>

      {/* Top-left badge: RLFC */}
      <div style={{
        position:'absolute', top:6, left:8,
        fontSize:9, fontWeight:800, color:'rgba(255,255,255,0.85)',
        letterSpacing:1, textShadow:'0 1px 3px rgba(0,0,0,0.7)', pointerEvents:'none',
      }}>RLFC</div>
      {/* Top-right arrow */}
      <div style={{
        position:'absolute', top:6, right:8,
        fontSize:9, fontWeight:700, color:'rgba(255,255,255,0.7)',
        letterSpacing:0.5, textShadow:'0 1px 3px rgba(0,0,0,0.7)', pointerEvents:'none',
        display:'inline-flex', alignItems:'center', gap:3,
      }}>ATTAQUE →</div>

      {form.slots.map((slot, i) => {
        const pid = lineup[i];
        const player = pid ? players.find(p => p.id === pid) : null;
        const pos = POSITIONS.find(x => x.id === slot.pos);
        const isSelected = pid && pid === selectedPid;
        const isEmpty = !player;
        const showPulse = selectedPid && isEmpty;
        const size = compact ? 30 : 38;
        const posColor = pos?.color || '#fff';
        return (
          <button key={i} onClick={()=>onSlotClick && onSlotClick(i)}
            className={showPulse ? 'pulse' : ''}
            style={{
              position:'absolute', left:`${slot.x}%`, top:`${slot.y}%`,
              transform:'translate(-50%,-50%)',
              background:'transparent', border:'none', padding:0,
              cursor: onSlotClick ? 'pointer' : 'default',
              textAlign:'center', display:'flex', flexDirection:'column', alignItems:'center', gap:1,
              zIndex: isSelected ? 5 : 1,
            }}>
            {/* CIRCLE */}
            <div style={{
              width:size, height:size, borderRadius:'50%',
              background: player
                ? (isSelected ? T.accent : '#FAFAFA')
                : 'rgba(0,0,0,0.45)',
              border: player
                ? `2px solid ${isSelected ? '#fff' : posColor}`
                : `1.5px dashed ${posColor}AA`,
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize: player ? (compact ? 12 : 14) : (compact ? 9 : 10),
              fontWeight:800,
              color: player
                ? (isSelected ? '#fff' : '#0F1419')
                : posColor,
              boxShadow: isSelected
                ? `0 0 0 4px ${T.accent}55, 0 3px 10px rgba(0,0,0,0.5)`
                : (player ? '0 2px 6px rgba(0,0,0,0.35)' : 'none'),
              transition:'all 0.18s',
              letterSpacing: player ? 0 : 0.3,
            }}>
              {player
                ? (player.number || (player.firstName?.[0]||'?'))
                : (pos?.short || slot.pos)
              }
            </div>
            {/* NAME (only filled) */}
            {player && (
              <div style={{
                fontSize: compact ? 8 : 9,
                fontWeight:700, color:'#fff', marginTop:2,
                textShadow:'0 1px 2px rgba(0,0,0,0.85), 0 0 4px rgba(0,0,0,0.6)',
                whiteSpace:'nowrap', maxWidth: compact?52:64, overflow:'hidden', textOverflow:'ellipsis',
                letterSpacing:0.1,
              }}>{player.lastName || player.firstName}</div>
            )}
          </button>
        );
      })}
    </div>
  );
}

function MatchLive({ match, setMatch, players, onEnd, onCancel, T }) {
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [half, setHalf] = useState(1);
  const intervalRef = useRef(null);
  const [eventModal, setEventModal] = useState(false);
  const [eventDraft, setEventDraft] = useState({ type:'goal', playerId:'', playerOutId:'', playerInId:'', minute:0, note:'' });
  const [showLineup, setShowLineup] = useState(false);
  const [showPlayTime, setShowPlayTime] = useState(false);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => setElapsed(e => e + 1), 1000);
    } else if (intervalRef.current) {
      clearInterval(intervalRef.current);
    }
    return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
  }, [running]);

  const halfDuration = (match.duration / 2) * 60;
  const minute = Math.floor(elapsed / 60) + (half === 2 ? Math.floor(halfDuration/60) : 0);
  const totalDurationS = match.duration * 60;
  const elapsedTotal = (half === 2 ? halfDuration : 0) + elapsed;
  const totalProgress = Math.min((elapsedTotal / totalDurationS) * 100, 100);

  function addEvent(type) {
    setEventDraft({ type: type || 'goal', playerId:'', playerOutId:'', playerInId:'', minute, note:'' });
    setEventModal(true);
  }
  function saveEvent() {
    const ev = { ...eventDraft, id:uid(), createdAt: nowMs() };
    let newScore = { ...match.score };
    if (ev.type === 'goal') newScore.us++;
    else if (ev.type === 'goal_against') newScore.them++;

    let newLineup = ensureLineupArray(match);
    let newBench = [...(match.bench||[])];

    // Pour une substitution: appliquer le changement de composition LIVE
    if (ev.type === 'substitution' || ev.type === 'sub') {
      ev.type = 'substitution'; // normaliser
      if (ev.playerOutId && ev.playerInId) {
        const idx = newLineup.findIndex(p => p === ev.playerOutId);
        if (idx >= 0) {
          newLineup[idx] = ev.playerInId;
          // sortant va au banc
          if (!newBench.includes(ev.playerOutId)) newBench.push(ev.playerOutId);
          // entrant retiré du banc
          newBench = newBench.filter(p => p !== ev.playerInId);
        }
      }
    }

    setMatch({ ...match, events:[...match.events, ev], score:newScore, lineup:newLineup, bench:newBench });
    setEventModal(false);
  }
  function removeEvent(eid) {
    const ev = match.events.find(e=>e.id===eid);
    let newScore = { ...match.score };
    if (ev && ev.type === 'goal') newScore.us = Math.max(0, newScore.us-1);
    else if (ev && ev.type === 'goal_against') newScore.them = Math.max(0, newScore.them-1);
    setMatch({ ...match, events: match.events.filter(e=>e.id!==eid), score:newScore });
  }
  function adjustOpponentScore(delta) {
    setMatch({ ...match, score: { ...match.score, them: Math.max(0, match.score.them + delta) } });
  }
  function adjustOwnScore(delta) {
    setMatch({ ...match, score: { ...match.score, us: Math.max(0, match.score.us + delta) } });
  }
  function nextHalf() {
    if (half === 1) {
      setHalf(2); setElapsed(0); setRunning(false);
    }
  }

  const lineup = useMemo(() => ensureLineupArray(match), [match.lineup, match.formation]);
  const lineupPlayers = lineupPids(lineup).map(pid => players.find(p=>p.id===pid)).filter(Boolean);
  const benchPlayers = (match.bench||[]).map(pid => players.find(p=>p.id===pid)).filter(Boolean);
  const allEligible = [...lineupPlayers, ...benchPlayers];

    <div style={{ minHeight:'100%', background: T.bg }}>

/* ============================================================
   PLAYING TIME TABLE (réutilisé Live + Recap)
   liveMinute: si fourni, considère que le match est en cours à cette minute
============================================================ */
function PlayingTimeTable({ match, players, T, liveMinute=null }) {
  // Compute with current state. If live, we artificially cap match.duration to liveMinute for the calculation.
  const effectiveMatch = useMemo(() => {
    if (liveMinute === null) return match;
    return { ...match, duration: Math.max(1, liveMinute) };
  }, [match, liveMinute]);

  const times = useMemo(() => computePlayingTimes(effectiveMatch, players), [effectiveMatch, players]);
  const matchDuration = effectiveMatch.duration || 60;
  const acffMin = matchDuration * 0.5; // 50% obligatoire ACFF U12

  // Liste tous les joueurs concernés (lineup actuel + bench + absent + sub_in via events)
  const concernedPids = useMemo(() => {
    const s = new Set();
    ensureLineupArray(match).filter(Boolean).forEach(pid => s.add(pid));
    (match.bench||[]).forEach(pid => s.add(pid));
    (match.absent||[]).forEach(pid => s.add(pid));
    (match.events||[]).forEach(ev => {
      if (ev.playerOutId) s.add(ev.playerOutId);
      if (ev.playerInId) s.add(ev.playerInId);
    });
    return Array.from(s);
  }, [match]);

  const rows = concernedPids
    .map(pid => ({ player: players.find(p => p.id === pid), time: times[pid] || { minutes:0, status:'absent' } }))
    .filter(r => r.player)
    .sort((a,b) => b.time.minutes - a.time.minutes);

  if (rows.length === 0) {
    return <EmptyState icon="clock" title="Aucune donnée" message="Aucun joueur dans cette compo"/>;
  }

  return (
    <div>
      {liveMinute !== null && (
        <div style={{ padding:'8px 12px', background:T.infoLight, color:T.info, borderRadius:8, fontSize:11, fontWeight:600, marginBottom:10, display:'flex', alignItems:'center', gap:6 }}>
          <Icon name="info" size={12}/>
          Calcul live à la minute <strong>{liveMinute}'</strong> · ACFF mini : {Math.round(acffMin)} min (50% de {matchDuration})
        </div>
      )}
      <div style={{ display:'grid', gap:5 }}>
        {rows.map(({ player, time }) => {
          const pos = POSITIONS.find(x => x.id === player.position);
          const isAbsent = (match.absent||[]).includes(player.id);
          const belowAcff = !isAbsent && time.minutes < acffMin && (liveMinute===null);
          const minColor = isAbsent ? T.text3
            : time.minutes === 0 ? T.text3
            : time.minutes >= acffMin ? T.success
            : T.warning;
          const statusLabel =
            isAbsent ? 'Absent'
            : time.status === 'starter' ? (time.outAt === matchDuration ? 'Titulaire' : 'Titulaire (sorti)')
            : time.status === 'sub_in' ? 'Entré en cours'
            : time.minutes > 0 ? 'A joué'
            : 'Banc';
          const pct = matchDuration > 0 ? Math.min(100, (time.minutes / matchDuration) * 100) : 0;
          return (
            <div key={player.id} style={{
              padding:'8px 10px', background:T.card2, borderRadius:9,
              border:`1px solid ${belowAcff ? T.danger+'40' : T.border}`,
              display:'flex', alignItems:'center', gap:9,
            }}>
              <Avatar name={`${player.firstName} ${player.lastName}`} size={28} color={pos?.color}/>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:12, fontWeight:700, color:T.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>

}

function MatchRecap({ match, players, T, onBack, onEdit, onDelete, confirmDelete, setConfirmDelete, deleteMatch }) {
  const mt = MATCH_TYPES.find(t=>t.id===match.type);
  const result = match.score.us > match.score.them ? 'V' : (match.score.us < match.score.them ? 'D' : 'N');
  const resultColor = result==='V' ? T.success : result==='D' ? T.danger : T.warning;
  const resultLabel = result==='V' ? 'VICTOIRE' : result==='D' ? 'DÉFAITE' : 'MATCH NUL';
  const form = getFormation(match.formation);
  const lineup = ensureLineupArray(match);
  const lineupPlayers = lineupPids(lineup).map(pid => players.find(p=>p.id===pid)).filter(Boolean);
  const benchPlayers = (match.bench||[]).map(pid => players.find(p=>p.id===pid)).filter(Boolean);
  const absentPlayers = (match.absent||[]).map(pid => players.find(p=>p.id===pid)).filter(Boolean);

  // Player match stats
  const playerStats = useMemo(() => {
    const stats = {};
    (match.events||[]).forEach(ev => {
      if (!ev.playerId) return;
      if (!stats[ev.playerId]) stats[ev.playerId] = { goals:0, assists:0, yellow:0, red:0, save:0 };
      if (ev.type === 'goal') stats[ev.playerId].goals++;
      else if (ev.type === 'assist') stats[ev.playerId].assists++;
      else if (ev.type === 'yellow') stats[ev.playerId].yellow++;
      else if (ev.type === 'red') stats[ev.playerId].red++;
      else if (ev.type === 'save') stats[ev.playerId].save++;
    });
    return stats;
  }, [match.events]);

  const scorers = useMemo(() =>
    Object.entries(playerStats)
      .filter(([, s]) => s.goals > 0)
      .map(([pid, s]) => ({ player: players.find(p => p.id === pid), goals: s.goals, assists: s.assists }))
      .filter(x => x.player)

    <PageContainer>

      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:18, flexWrap:'wrap' }}>

      </div>

      {/* RESULT HERO */}
      <Card padding={0} style={{ marginBottom:14, overflow:'hidden' }}>
        <div style={{ height:5, background:resultColor }}/>
        <div style={{
          padding:'22px 18px',
          background:`linear-gradient(135deg, ${resultColor}15 0%, ${T.card} 70%)`,
        }}>
          <div style={{ textAlign:'center', marginBottom:14 }}>
            <Badge bg={resultColor} color="#fff" style={{ fontSize:13, padding:'5px 14px' }}>{resultLabel}</Badge>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr auto 1fr', alignItems:'center', gap:18 }}>
            <div style={{ textAlign:'center' }}>
              <div style={{ fontSize:13, color:T.text2, fontWeight:700, letterSpacing:0.5, textTransform:'uppercase', marginBottom:6 }}>RLFC</div>
              <div style={{
                fontSize:68, fontWeight:800, lineHeight:1, fontVariantNumeric:'tabular-nums', letterSpacing:-2,
                color: result==='V' ? resultColor : (result==='N' ? T.text : T.text2),
              }}>{match.score.us}</div>
            </div>
            <div style={{ fontSize:32, fontWeight:700, color:T.text3 }}>–</div>
            <div style={{ textAlign:'center' }}>
              <div style={{
                fontSize:13, color:T.text2, fontWeight:700, letterSpacing:0.5, textTransform:'uppercase', marginBottom:6,
                whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',

              <div style={{
                fontSize:68, fontWeight:800, lineHeight:1, fontVariantNumeric:'tabular-nums', letterSpacing:-2,
                color: result==='D' ? resultColor : (result==='N' ? T.text : T.text2),

          </div>

function PlayerAttendanceCard({ player, sessions, T }) {
  const stats = useMemo(() => playerAttendanceStats(sessions, player.id), [sessions, player.id]);
  const recentSessions = useMemo(() => {
    return (sessions||[])
      .filter(s => s.done)
      .sort((a,b) => b.date.localeCompare(a.date))
      .slice(0, 10);
  }, [sessions]);

  if (stats.total === 0) {
    return (
      <Card padding={16} style={{ marginBottom:14 }}>
        <SectionTitle>Présences saison</SectionTitle>
        <EmptyState icon="clock" title="Aucune séance terminée" message="Les statistiques apparaîtront après la première séance terminée"/>
      </Card>
    );
  }

  const rateColor = stats.rate >= 0.85 ? T.success : (stats.rate >= 0.70 ? T.warning : T.danger);
  return (
    <Card padding={16} style={{ marginBottom:14 }}>
      <SectionTitle>Présences saison ({stats.total} séances)</SectionTitle>

      {/* Taux principal */}
      <div style={{
        padding:16, background:`linear-gradient(135deg, ${rateColor}18 0%, ${T.card2} 100%)`,
        borderRadius:12, border:`1px solid ${rateColor}40`,
        display:'flex', alignItems:'center', gap:14, marginBottom:14,
      }}>
        <div style={{
          width:64, height:64, borderRadius:32,
          background:rateColor, color:'#fff',
          display:'flex', alignItems:'center', justifyContent:'center',
          fontSize:22, fontWeight:800, fontVariantNumeric:'tabular-nums',
          flexShrink:0, letterSpacing:-0.5,
        }}>{Math.round(stats.rate*100)}%</div>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:13, fontWeight:700, color:T.text, marginBottom:4 }}>Taux de présence</div>
          <div style={{ fontSize:12, color:T.text2, lineHeight:1.4 }}>
            <strong style={{ color:T.success }}>{stats.attended}</strong> présent{stats.attended>1?'s':''} (dont <strong>{stats.late}</strong> retard{stats.late>1?'s':''}) ·
            <strong style={{ color:T.danger }}> {stats.absences}</strong> absent{stats.absences>1?'s':''}
            {stats.injured > 0 && <> · <strong style={{ color:T.purple }}>{stats.injured}</strong> blessé{stats.injured>1?'s':''}</>}
          </div>
        </div>
      </div>

      {/* Grille détail par état */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(70px,1fr))', gap:8, marginBottom:14 }}>
        {ATTENDANCE_STATES.map(st => {
          const color = T[st.colorKey];
          const n = stats[st.id];
          return (
            <div key={st.id} style={{
              padding:'10px 6px', background:T.card2, borderRadius:9,
              border:`1px solid ${T.border}`, textAlign:'center',
            }}>
              <Icon name={st.icon} size={14} color={color}/>
              <div style={{ fontSize:18, fontWeight:800, color:T.text, lineHeight:1, marginTop:5, fontVariantNumeric:'tabular-nums' }}>{n}</div>
              <div style={{ fontSize:9, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.3, marginTop:3 }}>{st.short}</div>
            </div>
          );
        })}
      </div>

      {/* Alerte si trop d'absences non excusées */}
      {stats.unexcused >= 2 && (
        <div style={{
          padding:'10px 12px', background:T.dangerLight, borderRadius:9,
          border:`1px solid ${T.danger}40`,
          display:'flex', alignItems:'center', gap:8, marginBottom:14,
        }}>
          <Icon name="alert" size={14} color={T.danger}/>
          <span style={{ fontSize:12, color:T.danger, fontWeight:600 }}>
            {stats.unexcused} absence{stats.unexcused>1?'s':''} non excusée{stats.unexcused>1?'s':''} cette saison
          </span>
        </div>
      )}

      {/* Frise chronologique 10 dernières séances */}
      <div>
        <div style={{ fontSize:11, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.7, marginBottom:8 }}>10 dernières séances</div>
        <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
          {recentSessions.map(s => {
            const att = getAttendance(s, player.id);
            const st = ATTENDANCE_STATES.find(x => x.id === att.status);
            const color = T[st.colorKey];
            return (
              <div key={s.id} title={`${dateFmt(s.date)} — ${st.label}${att.note?` (${att.note})`:''}`}
                style={{
                  width:36, padding:'6px 4px', borderRadius:7,
                  background:color, color:'#fff',
                  display:'flex', flexDirection:'column', alignItems:'center', gap:2,
                  cursor:'default',
                }}>
                <Icon name={st.icon} size={11}/>
                <span style={{ fontSize:9, fontWeight:700, lineHeight:1 }}>{new Date(s.date).getDate()}/{new Date(s.date).getMonth()+1}</span>
              </div>
            );
          })}
        </div>
      </div>
    </Card>
  );
}

function SuiviPage({ players, evals, setEvals, matches, sessions, T, showToast }) {
  const [selectedPid, setSelectedPid] = useState(null);
  const [date, setDate] = useState(todayIso());
  const [tab, setTab] = useState(0); // 0=team 1=player

  const selectedPlayer = players.find(p => p.id === selectedPid);

  function getEval(pid, d) {
    if (!evals[pid]) return null;
    return evals[pid][d] || null;
  }
  function setEvalField(pid, d, partial) {
    setEvals(prev => {
      const pData = prev[pid] || {};
      const cur = pData[d] || { ...EVAL_DEFAULTS };
      return { ...prev, [pid]: { ...pData, [d]: { ...EVAL_DEFAULTS, ...cur, ...partial } } };
    });
  }
  function setEvalFn(pid, d, fn) {
    setEvals(prev => {
      const pData = prev[pid] || {};
      const cur = pData[d] || { ...EVAL_DEFAULTS };
      const base = { ...EVAL_DEFAULTS, ...cur };
      return { ...prev, [pid]: { ...pData, [d]: { ...base, ...fn(base) } } };
    });
  }
  function deleteEval(pid, d) {
    setEvals(prev => {
      const pData = { ...(prev[pid]||{}) };
      delete pData[d];
      return { ...prev, [pid]: pData };
    });
  }

  // Team averages
  const teamAverages = useMemo(() => {
    const sums = {}; const counts = {};
    PILLARS.forEach(p => { sums[p.id] = 0; counts[p.id] = 0; });
    players.forEach(p => {
      const pData = evals[p.id];
      if (!pData) return;
      const dates = Object.keys(pData).sort();
      const latest = dates[dates.length - 1];
      if (!latest) return;
      const ev = pData[latest];
      PILLARS.forEach(pl => {
        const v = ev[pl.id];
        if (typeof v === 'number') {
          sums[pl.id] += v;
          counts[pl.id]++;
        }
      });
    });
    return PILLARS.map(p => ({
      ...p, value: counts[p.id] > 0 ? sums[p.id]/counts[p.id] : 0, count: counts[p.id]
    }));
  }, [players, evals]);

  const currentEval = selectedPid ? (getEval(selectedPid, date) || EVAL_DEFAULTS) : null;

  return (
    <PageContainer>
      <PageHeader title="Suivi" subtitle="Évaluation et progression des joueurs"/>

      <Tabs tabs={['Équipe','Joueur']} active={tab} onChange={setTab} style={{ marginBottom:16 }}/>

      {tab === 0 && (
        <>
          <Card padding={20} style={{ marginBottom:16 }}>
            <SectionTitle>Moyennes de l'équipe</SectionTitle>
            <div style={{ display:'flex', justifyContent:'center', marginBottom:16 }}>
              <Radar data={teamAverages.map(p => ({ label:p.label.slice(0,4), value:p.value }))} size={280}/>
            </div>
            <div style={{ display:'grid', gap:8 }}>
              {teamAverages.map(p => (
                <div key={p.id}>
                  <ProgressBar value={Math.round(p.value*10)/10} max={10} color={p.color} icon={p.icon} label={p.label}/>
                </div>
              ))}
            </div>
          </Card>

          <Card padding={16}>
            <SectionTitle>Top joueurs (moyenne dernière éval)</SectionTitle>
            {players.length === 0 ? (
              <EmptyState icon="chart" title="Aucun joueur évalué" message="Ajoute des joueurs et évalue-les"/>
            ) : (
              <div style={{ display:'grid', gap:8 }}>
                {players
                  .map(p => {
                    const pData = evals[p.id];
                    if (!pData) return { ...p, avg: 0, hasEval: false };
                    const dates = Object.keys(pData).sort();
                    const latest = dates[dates.length-1];
                    if (!latest) return { ...p, avg: 0, hasEval: false };
                    const ev = pData[latest];
                    const sum = PILLARS.reduce((s,pl) => s + (typeof ev[pl.id]==='number' ? ev[pl.id] : 0), 0);
                    return { ...p, avg: sum / PILLARS.length, hasEval: true };
                  })
                  .sort((a,b) => b.avg - a.avg)
                  .slice(0, 10)
                  .map((p,i) => {
                    const pos = POSITIONS.find(x => x.id === p.position);
                    return (
                      <div key={p.id} onClick={()=>{setSelectedPid(p.id); setTab(1);}}
                        style={{
                          display:'flex', alignItems:'center', gap:10,
                          padding:'10px 12px', background:T.card2, borderRadius:10,
                          cursor:'pointer', border:`1px solid ${T.border}`,
                        }}>
                        <div style={{
                          width:28, height:28, borderRadius:14,
                          background: i<3 ? T.gold : T.card3, color: i<3?'#1C1C1E':T.text2,
                          display:'flex', alignItems:'center', justifyContent:'center',
                          fontSize:12, fontWeight:800, flexShrink:0,
                        }}>{i+1}</div>
                        <Avatar name={`${p.firstName} ${p.lastName}`} size={36} color={pos?.color}/>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:13, fontWeight:700, color:T.text }}>{p.firstName} {p.lastName}</div>
                          <div style={{ fontSize:11, color:T.text2 }}>#{p.number} · {pos?.label}</div>
                        </div>
                        <Badge bg={p.hasEval?T.accent:T.card3} color="#fff">
                          {p.hasEval ? `${p.avg.toFixed(1)}/10` : 'non éval.'}
                        </Badge>
                      </div>
                    );
                  })}
              </div>
            )}
          </Card>
        </>
      )}

      {tab === 1 && (
        <>
          <Card padding={14} style={{ marginBottom:14 }}>
            <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
              <div style={{ flex:1, minWidth:200 }}>
                <Select label="Joueur" value={selectedPid||''} onChange={v=>setSelectedPid(v)}
                  options={[{value:'',label:'-- Choisir --'}, ...players.map(p=>({value:p.id, label:`#${p.number||'?'} ${p.firstName} ${p.lastName}`}))]}
                  placeholder=""/>
              </div>
              <Input label="Date" type="date" value={date} onChange={setDate} style={{ maxWidth:180 }}/>
            </div>
          </Card>

          {selectedPlayer ? (
            <>
              <Card padding={20} style={{ marginBottom:14 }}>
                <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:16 }}>
                  <Avatar name={`${selectedPlayer.firstName} ${selectedPlayer.lastName}`} size={56} color={POSITIONS.find(x=>x.id===selectedPlayer.position)?.color}/>
                  <div>
                    <div style={{ fontSize:18, fontWeight:800, color:T.text }}>{selectedPlayer.firstName} {selectedPlayer.lastName}</div>
                    <div style={{ fontSize:12, color:T.text2 }}>#{selectedPlayer.number} · {POSITIONS.find(x=>x.id===selectedPlayer.position)?.label}</div>
                  </div>
                </div>

                <SectionTitle>Évaluation du {dateFmt(date)}</SectionTitle>
                <div style={{ display:'grid', gap:14 }}>
                  {PILLARS.map(pillar => (
                    <Slider key={pillar.id}
                      label={pillar.label} icon={pillar.icon}
                      value={currentEval[pillar.id]} max={10} step={1}
                      onChange={(v)=>setEvalField(selectedPid, date, { [pillar.id]: v })}
                      color={pillar.color}/>
                  ))}
                </div>

                <Divider/>

                <SectionTitle>Tags</SectionTitle>
                <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                  {TAGS_LIBRARY.map(tag => {
                    const active = (currentEval.tags||[]).includes(tag);
                    return (
                      <Chip key={tag} active={active}
                        onClick={()=>setEvalFn(selectedPid, date, base => ({
                          tags: active ? base.tags.filter(t=>t!==tag) : [...base.tags, tag]
                        }))}>
                        {tag}
                      </Chip>
                    );
                  })}
                </div>

                <Divider/>

                <SectionTitle>Notes</SectionTitle>
                <Textarea value={currentEval.notes} onChange={v=>setEvalField(selectedPid, date, { notes:v })}
                  placeholder="Observations, points forts, axes à travailler..."/>
              </Card>

              {/* Présences saison */}
              <PlayerAttendanceCard player={selectedPlayer} sessions={sessions} T={T}/>

              {/* Historique */}
              <Card padding={16}>
                <SectionTitle>Historique des évaluations</SectionTitle>
                {(() => {
                  const dates = Object.keys(evals[selectedPid]||{}).sort().reverse();
                  if (dates.length === 0) return <EmptyState icon="chart" title="Aucune évaluation" message="Crée la première évaluation"/>;
                  return (
                    <div style={{ display:'grid', gap:8 }}>
                      {dates.map(d => {
                        const e = evals[selectedPid][d];

                        return (
                          <div key={d} onClick={()=>setDate(d)} style={{

                            <Badge bg={T.accent} color="#fff">{avg.toFixed(1)}/10</Badge>
