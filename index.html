/* ============================================================
   SESSION RECAP (page récap d'une séance terminée — lecture seule)
============================================================ */
function SessionRecap({ session, players, T, onBack, onEdit, onToggleDone, onDelete, confirmDelete, setConfirmDelete, deleteSession }) {
  const themes = (session.themes || []).map(id => SESSION_THEMES.find(t=>t.id===id)).filter(Boolean);
  const totalDuration = (session.exercises || []).reduce((sum,eid) => sum + (EXERCISES.find(e=>e.id===eid)?.dur||0), 0);
  const attCounts = attendanceCountsFor(session, players);
  const totalPresent = attCounts.present + attCounts.late;
  const totalAbsent = attCounts.excused + attCounts.unexcused;
  const presentRate = players.length > 0 ? totalPresent / players.length : 0;

  // Distribution exercices par catégorie
  const catDistribution = useMemo(() => {
    const m = {};
    (session.exercises || []).forEach(eid => {
      const ex = EXERCISES.find(e => e.id === eid);
      if (!ex) return;
      m[ex.cat] = (m[ex.cat] || 0) + (ex.dur || 0);
    });
    return Object.entries(m)
      .map(([cat, dur]) => ({ ...EXERCISE_CATEGORIES.find(c=>c.id===cat), duration:dur }))
      .filter(c => c.id)
      .sort((a,b) => b.duration - a.duration);
  }, [session.exercises]);

  // Players grouped by attendance status
  const playersByStatus = useMemo(() => {
    const grp = { present:[], late:[], excused:[], unexcused:[], injured:[] };
    (players || []).forEach(p => {
      const att = getAttendance(session, p.id);
      if (grp[att.status]) grp[att.status].push({ player:p, ...att });
    });
    return grp;
  }, [session, players]);

  return (
    <PageContainer>
      {/* HEADER */}
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:18, flexWrap:'wrap' }}>
        <IconBtn icon="arrowLeft" onClick={onBack}/>
        <div style={{ flex:1, minWidth:200 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4, flexWrap:'wrap' }}>
            <Badge bg={T.successLight} color={T.success}><Icon name="check" size={11}/> Terminée</Badge>
            <Badge bg={T.card3} color={T.text2}>{dateFmt(session.date)}</Badge>
            <Badge bg={T.card3} color={T.text2}>{session.time}</Badge>
            <Badge bg={T.card3} color={T.text2}>{session.duration} min</Badge>
          </div>
          <h1 style={{ fontSize:22, fontWeight:800, color:T.text, margin:0, letterSpacing:-0.3, lineHeight:1.2 }}>
            {sessionDisplayTheme(session)}
          </h1>
        </div>
        <Btn variant="secondary" icon="edit" onClick={onEdit}>Modifier</Btn>
      </div>

      {/* QUICK INFO STRIP */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))', gap:10, marginBottom:14 }}>
        <Card padding={14}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:36, height:36, borderRadius:10, background:T.info+'18', color:T.info, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <Icon name="pin" size={18}/>
            </div>
            <div style={{ minWidth:0 }}>
              <div style={{ fontSize:10, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.5 }}>Lieu</div>
              <div style={{ fontSize:13, fontWeight:700, color:T.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{session.location || '—'}</div>
            </div>
          </div>
        </Card>
        <Card padding={14}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:36, height:36, borderRadius:10, background:T.success+'18', color:T.success, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <Icon name="users" size={18}/>
            </div>
            <div style={{ minWidth:0 }}>
              <div style={{ fontSize:10, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.5 }}>Présence</div>
              <div style={{ fontSize:13, fontWeight:700, color:T.text, fontVariantNumeric:'tabular-nums' }}>{totalPresent}/{players.length} <span style={{ color:T.text2, fontWeight:600 }}>({Math.round(presentRate*100)}%)</span></div>
            </div>
          </div>
        </Card>
        <Card padding={14}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:36, height:36, borderRadius:10, background:T.accent+'18', color:T.accent, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <Icon name="clipboard" size={18}/>
            </div>
            <div style={{ minWidth:0 }}>
              <div style={{ fontSize:10, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.5 }}>Exercices</div>
              <div style={{ fontSize:13, fontWeight:700, color:T.text, fontVariantNumeric:'tabular-nums' }}>{(session.exercises||[]).length} <span style={{ color:T.text2, fontWeight:600 }}>({totalDuration} min)</span></div>
            </div>
          </div>
        </Card>
        <Card padding={14}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:36, height:36, borderRadius:10, background:T.warning+'18', color:T.warning, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <Icon name="clock" size={18}/>
            </div>
            <div style={{ minWidth:0 }}>
              <div style={{ fontSize:10, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.5 }}>Retards</div>
              <div style={{ fontSize:13, fontWeight:700, color:T.text, fontVariantNumeric:'tabular-nums' }}>{attCounts.late}</div>
            </div>
          </div>
        </Card>
      </div>

      {/* THEMES + OBJECTIVES */}
      {(themes.length > 0 || session.theme || session.objectives) && (
        <Card padding={18} style={{ marginBottom:14 }}>
          {themes.length > 0 && (
            <div style={{ marginBottom: (session.theme || session.objectives) ? 14 : 0 }}>
              <div style={{ fontSize:11, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.7, marginBottom:8 }}>Thèmes travaillés</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                {themes.map(t => (
                  <span key={t.id} style={{
                    padding:'5px 11px', borderRadius:8,
                    background: t.color+'1E', color: t.color,
                    fontSize:12.5, fontWeight:600,
                    border:`1px solid ${t.color}40`,
                  }}>{t.label}</span>
                ))}
                {session.theme && (
                  <span style={{
                    padding:'5px 11px', borderRadius:8,
                    background: T.card3, color: T.text,
                    fontSize:12.5, fontWeight:600,
                    border:`1px solid ${T.border}`,
                  }}>{session.theme}</span>
                )}
              </div>
            </div>
          )}
          {!themes.length && session.theme && (
            <div style={{ marginBottom: session.objectives ? 14 : 0 }}>
              <div style={{ fontSize:11, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.7, marginBottom:6 }}>Thème</div>
              <div style={{ fontSize:14, color:T.text }}>{session.theme}</div>
            </div>
          )}
          {session.objectives && (
            <div>
              <div style={{ fontSize:11, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.7, marginBottom:6 }}>Objectifs</div>
              <div style={{ fontSize:14, color:T.text, lineHeight:1.5, whiteSpace:'pre-wrap' }}>{session.objectives}</div>
            </div>
          )}
        </Card>
      )}

      {/* ATTENDANCE BREAKDOWN */}
      <Card padding={18} style={{ marginBottom:14 }}>
        <SectionTitle>Présences</SectionTitle>

        {/* Stats overview */}
        <div style={{
          display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(85px,1fr))', gap:8, marginBottom:16,
        }}>
          {ATTENDANCE_STATES.map(st => {
            const color = T[st.colorKey];
            const n = attCounts[st.id];
            return (
              <div key={st.id} style={{
                padding:'12px 8px',
                background: n>0 ? color+'15' : T.card2,
                borderRadius:10,
                border:`1px solid ${n>0 ? color+'40' : T.border}`,
                textAlign:'center',
                opacity: n===0 ? 0.55 : 1,
              }}>
                <Icon name={st.icon} size={15} color={color}/>
                <div style={{ fontSize:20, fontWeight:800, color:T.text, lineHeight:1, marginTop:5, fontVariantNumeric:'tabular-nums' }}>{n}</div>
                <div style={{ fontSize:9.5, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.3, marginTop:3 }}>{st.short}</div>
              </div>
            );
          })}
        </div>

        {/* Présents / Retards : juste avatars */}
        {(playersByStatus.present.length + playersByStatus.late.length) > 0 && (
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:11, fontWeight:700, color:T.success, textTransform:'uppercase', letterSpacing:0.7, marginBottom:8, display:'flex', alignItems:'center', gap:6 }}>
              <Icon name="check" size={12}/> Présents ({playersByStatus.present.length + playersByStatus.late.length})
            </div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
              {[...playersByStatus.present, ...playersByStatus.late].map(({ player, status, lateMinutes, note }) => {
                const pos = POSITIONS.find(x => x.id === player.position);
                const isLate = status === 'late';
                return (
                  <div key={player.id} title={isLate ? `Retard${lateMinutes>0?` +${lateMinutes}min`:''}${note?` — ${note}`:''}` : 'Présent'}
                    style={{
                      display:'flex', alignItems:'center', gap:7,
                      padding:'5px 11px 5px 5px',
                      background: isLate ? T.warningLight : T.card2,
                      border:`1px solid ${isLate ? T.warning+'50' : T.border}`,
                      borderRadius:999,
                    }}>
                    <Avatar name={`${player.firstName} ${player.lastName}`} size={26} color={pos?.color}/>
                    <span style={{ fontSize:12, fontWeight:600, color:T.text }}>
                      #{player.number||'?'} {player.lastName || player.firstName}
                    </span>
                    {isLate && (
                      <span style={{ fontSize:10, fontWeight:700, color:T.warning, padding:'1px 6px', background:T.warning+'20', borderRadius:6 }}>
                        +{lateMinutes||'?'}min
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Absents / Blessés : détaillés avec notes */}
        {['excused','unexcused','injured'].map(statusKey => {
          const list = playersByStatus[statusKey];
          if (list.length === 0) return null;
          const st = ATTENDANCE_STATES.find(s => s.id === statusKey);
          const color = T[st.colorKey];
          return (
            <div key={statusKey} style={{ marginBottom:14 }}>
              <div style={{ fontSize:11, fontWeight:700, color, textTransform:'uppercase', letterSpacing:0.7, marginBottom:8, display:'flex', alignItems:'center', gap:6 }}>
                <Icon name={st.icon} size={12}/> {st.label} ({list.length})
              </div>
              <div style={{ display:'grid', gap:6 }}>
                {list.map(({ player, note }) => {
                  const pos = POSITIONS.find(x => x.id === player.position);
                  return (
                    <div key={player.id} style={{
                      display:'flex', alignItems:'center', gap:10,
                      padding:'9px 12px', background: color+'12',
                      border:`1px solid ${color}30`, borderRadius:9,
                    }}>
                      <Avatar name={`${player.firstName} ${player.lastName}`} size={32} color={pos?.color}/>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:13, fontWeight:700, color:T.text }}>
                          #{player.number||'?'} {player.firstName} {player.lastName}
                        </div>
                        {note && (
                          <div style={{ fontSize:11.5, color:T.text2, marginTop:2, fontStyle:'italic', display:'flex', alignItems:'center', gap:5 }}>
                            <Icon name="noteEdit" size={10} color={T.text3}/>
                            {note}
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </Card>

      {/* EXERCISES */}
      <Card padding={18} style={{ marginBottom:14 }}>
        <SectionTitle>Exercices ({(session.exercises||[]).length})</SectionTitle>
        {(session.exercises||[]).length === 0 ? (
          <EmptyState icon="clipboard" title="Aucun exercice" message="Aucun exercice n'a été ajouté à cette séance"/>
        ) : (
          <>
            {/* Bar of category distribution */}
            {catDistribution.length > 0 && (
              <div style={{ marginBottom:14 }}>
                <div style={{ fontSize:11, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.7, marginBottom:6 }}>Répartition ({totalDuration} min)</div>
                <div style={{ display:'flex', height:14, borderRadius:7, overflow:'hidden', background:T.card3 }}>
                  {catDistribution.map(c => (
                    <div key={c.id} title={`${c.label} — ${c.duration} min`}
                      style={{
                        background:c.color,
                        width:`${(c.duration/totalDuration)*100}%`,
                      }}/>
                  ))}
                </div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginTop:6 }}>
                  {catDistribution.map(c => (
                    <span key={c.id} style={{ display:'inline-flex', alignItems:'center', gap:5, fontSize:11, color:T.text2, fontWeight:600 }}>
                      <span style={{ width:8, height:8, borderRadius:4, background:c.color }}/>
                      {c.label} ({c.duration}m)
                    </span>
                  ))}
                </div>
              </div>
            )}

            <div style={{ display:'grid', gap:8 }}>
              {(session.exercises||[]).map((eid, idx) => {
                const ex = EXERCISES.find(e => e.id === eid);
                if (!ex) return null;
                const cat = EXERCISE_CATEGORIES.find(c => c.id === ex.cat);
                return (
                  <div key={eid+'_'+idx} style={{
                    display:'flex', alignItems:'flex-start', gap:10,
                    padding:'10px 12px', background:T.card2, borderRadius:10,
                    border:`1px solid ${T.border}`,
                  }}>
                    <div style={{
                      width:30, height:30, borderRadius:8, flexShrink:0,
                      background:cat.color+'1F', color:cat.color,
                      display:'flex', alignItems:'center', justifyContent:'center',
                      fontSize:12, fontWeight:800,
                    }}>{idx+1}</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:7, flexWrap:'wrap', marginBottom:3 }}>
                        <div style={{ fontSize:13.5, fontWeight:700, color:T.text }}>{ex.name}</div>
                        <Badge bg={cat.color+'1F'} color={cat.color}><Icon name={cat.icon} size={10}/> {cat.label}</Badge>
                        <Badge bg={T.card3} color={T.text2}><Icon name="clock" size={10}/> {ex.dur} min</Badge>
                      </div>
                      <div style={{ fontSize:11.5, color:T.text2, lineHeight:1.45 }}>{ex.desc}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </Card>

      {/* NOTES */}
      {session.notes && session.notes.trim() && (
        <Card padding={18} style={{ marginBottom:14 }}>
          <SectionTitle>Notes coach</SectionTitle>
          <div style={{
            fontSize:14, color:T.text, lineHeight:1.6,
            whiteSpace:'pre-wrap',
            padding:14, background:T.card2, borderRadius:9,
            border:`1px solid ${T.border}`,
          }}>{session.notes}</div>
        </Card>
      )}

      {/* BOTTOM ACTIONS */}
      <Card padding={14}>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <Btn variant="primary" icon="edit" onClick={onEdit}>Modifier la séance</Btn>
            <Btn variant="secondary" icon="refresh" onClick={onToggleDone}>Marquer non terminée</Btn>
          </div>
          <Btn variant="danger" icon="trash" onClick={onDelete}>Supprimer</Btn>
        </div>
      </Card>

      <ConfirmDialog open={!!confirmDelete} title="Supprimer cette séance ?"
        message="Cette action est irréversible. Toutes les présences et notes seront perdues."
        onConfirm={()=>deleteSession(confirmDelete)} onCancel={()=>setConfirmDelete(null)}/>
    </PageContainer>
  );
}

/* ============================================================
   ATTENDANCE SECTION (présences avec 5 états + notes + actions globales)
============================================================ */
function AttendanceSection({ session, players, T, setStatusFor, setNoteFor, setLateMinFor, markAll, resetAttendance, attCounts }) {
  const [filter, setFilter] = useState('all');
  const [expandedNotes, setExpandedNotes] = useState({}); // {pid: true}

  function toggleNote(pid) {
    setExpandedNotes(prev => ({ ...prev, [pid]: !prev[pid] }));
  }

  const filteredPlayers = useMemo(() => {
    if (filter === 'all') return players;
    return players.filter(p => getAttendance(session, p.id).status === filter);
  }, [players, session, filter]);

  const totalPresent = attCounts.present + attCounts.late;
  const totalAbsent = attCounts.excused + attCounts.unexcused;
  const totalInjured = attCounts.injured;

  return (
    <Card padding={16} style={{ marginBottom:16 }}>
      <SectionTitle>Présences</SectionTitle>

      {/* Stats résumé */}
      <div style={{
        display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(80px,1fr))', gap:8, marginBottom:12,
      }}>
        <div style={{ padding:'10px 8px', background:T.successLight, borderRadius:9, textAlign:'center', border:`1px solid ${T.success}40` }}>
          <div style={{ fontSize:20, fontWeight:800, color:T.success, lineHeight:1, fontVariantNumeric:'tabular-nums' }}>{totalPresent}</div>
          <div style={{ fontSize:10, fontWeight:700, color:T.success, textTransform:'uppercase', letterSpacing:0.4, marginTop:3 }}>présents</div>
        </div>
        <div style={{ padding:'10px 8px', background:T.warningLight, borderRadius:9, textAlign:'center', border:`1px solid ${T.warning}40` }}>
          <div style={{ fontSize:20, fontWeight:800, color:T.warning, lineHeight:1, fontVariantNumeric:'tabular-nums' }}>{attCounts.late}</div>
          <div style={{ fontSize:10, fontWeight:700, color:T.warning, textTransform:'uppercase', letterSpacing:0.4, marginTop:3 }}>retards</div>
        </div>
        <div style={{ padding:'10px 8px', background:T.dangerLight, borderRadius:9, textAlign:'center', border:`1px solid ${T.danger}40` }}>
          <div style={{ fontSize:20, fontWeight:800, color:T.danger, lineHeight:1, fontVariantNumeric:'tabular-nums' }}>{totalAbsent}</div>
          <div style={{ fontSize:10, fontWeight:700, color:T.danger, textTransform:'uppercase', letterSpacing:0.4, marginTop:3 }}>absents</div>
        </div>
        <div style={{ padding:'10px 8px', background:T.purple+'18', borderRadius:9, textAlign:'center', border:`1px solid ${T.purple}40` }}>
          <div style={{ fontSize:20, fontWeight:800, color:T.purple, lineHeight:1, fontVariantNumeric:'tabular-nums' }}>{totalInjured}</div>
          <div style={{ fontSize:10, fontWeight:700, color:T.purple, textTransform:'uppercase', letterSpacing:0.4, marginTop:3 }}>blessés</div>
        </div>
        <div style={{ padding:'10px 8px', background:T.card2, borderRadius:9, textAlign:'center', border:`1px solid ${T.border}` }}>
          <div style={{ fontSize:20, fontWeight:800, color:T.text, lineHeight:1, fontVariantNumeric:'tabular-nums' }}>{players.length>0?Math.round(totalPresent/players.length*100):0}%</div>
          <div style={{ fontSize:10, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.4, marginTop:3 }}>taux</div>
        </div>
      </div>

      {/* Actions globales */}
      <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:14, paddingBottom:14, borderBottom:`1px solid ${T.border}` }}>
        <Btn size="sm" variant="success" icon="check" onClick={()=>markAll('present')}>Tous présents</Btn>
        <Btn size="sm" variant="secondary" icon="close" onClick={()=>markAll('unexcused')}>Tous absents</Btn>
        <Btn size="sm" variant="ghost" icon="refresh" onClick={resetAttendance}>Réinitialiser</Btn>
      </div>

      {/* Filtres */}
      {players.length > 5 && (
        <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:12 }}>
          <Chip active={filter==='all'} onClick={()=>setFilter('all')}>Tous ({players.length})</Chip>
          {ATTENDANCE_STATES.map(st => {
            const n = attCounts[st.id];
            if (n === 0) return null;
            return (
              <Chip key={st.id} active={filter===st.id} onClick={()=>setFilter(st.id)}
                color={T[st.colorKey]} icon={st.icon} count={n}>{st.short}</Chip>
            );
          })}
        </div>
      )}

      {/* Liste joueurs */}
      {players.length === 0 ? (
        <EmptyState icon="users" title="Aucun joueur" message="Ajoute des joueurs dans Groupe"/>
      ) : filteredPlayers.length === 0 ? (
        <EmptyState icon="users" title="Aucun joueur" message="Aucun joueur ne correspond au filtre"/>
      ) : (
        <div style={{ display:'grid', gap:10 }}>
          {filteredPlayers.map(p => {
            const att = getAttendance(session, p.id);
            const state = ATTENDANCE_STATES.find(s => s.id === att.status);
            const color = T[state.colorKey];
            const isExpanded = !!expandedNotes[p.id];
            const hasNote = att.note && att.note.trim();
            return (
              <div key={p.id} style={{
                background:T.card2, borderRadius:11,
                border:`1.5px solid ${color}50`,
                padding:'10px 12px',
                transition:'border-color 0.15s',
              }}>
                {/* Top row: avatar + name + status badge */}
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
                  <Avatar name={`${p.firstName} ${p.lastName}`} size={36}/>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:T.text, lineHeight:1.2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                      #{p.number || '?'} {p.firstName} {p.lastName}
                    </div>
                    <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:3 }}>
                      <Icon name={state.icon} size={11} color={color}/>
                      <span style={{ fontSize:11, fontWeight:600, color }}>{state.label}</span>
                      {att.status === 'late' && att.lateMinutes > 0 && (
                        <span style={{ fontSize:11, color:T.warning, fontWeight:600 }}>· +{att.lateMinutes} min</span>
                      )}
                    </div>
                  </div>
                  {state.hasNote && (
                    <IconBtn
                      icon={isExpanded || hasNote ? 'noteEdit' : 'plus'}
                      size={30}
                      title={hasNote ? 'Modifier la note' : 'Ajouter une note'}
                      bg={hasNote ? T.accentLight : undefined}
                      color={hasNote ? T.accent : undefined}
                      onClick={()=>toggleNote(p.id)}/>
                  )}
                </div>

                {/* Status buttons */}
                <div style={{ display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap:4 }}>
                  {ATTENDANCE_STATES.map(st => {
                    const stColor = T[st.colorKey];
                    const isActive = att.status === st.id;
                    return (
                      <button key={st.id}
                        onClick={()=>{
                          setStatusFor(p.id, st.id);
                          if (st.hasNote && !hasNote) setExpandedNotes(prev=>({...prev, [p.id]:true}));
                        }}
                        title={st.label}
                        style={{
                          padding:'7px 4px', borderRadius:7,
                          background: isActive ? stColor : T.card3,
                          color: isActive ? '#fff' : T.text2,
                          border:`1px solid ${isActive ? stColor : 'transparent'}`,
                          cursor:'pointer', transition:'all 0.12s',
                          display:'flex', flexDirection:'column', alignItems:'center', gap:2,
                          fontWeight:600,
                        }}>
                        <Icon name={st.icon} size={14}/>
                        <span style={{ fontSize:9, fontWeight:700, letterSpacing:0.2 }}>{st.short}</span>
                      </button>
                    );
                  })}
                </div>

                {/* Note expandable */}
                {isExpanded && state.hasNote && (
                  <div className="slide-down" style={{ marginTop:10, paddingTop:10, borderTop:`1px solid ${T.border}` }}>
                    {att.status === 'late' && (
                      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
                        <span style={{ fontSize:11, fontWeight:700, color:T.text2, textTransform:'uppercase', letterSpacing:0.5 }}>Retard de</span>
                        <input type="number" min="0" max="120" value={att.lateMinutes || ''}
                          onChange={e=>setLateMinFor(p.id, Number(e.target.value)||0)}
                          placeholder="0"
                          style={{
                            width:60, padding:'4px 8px', fontSize:13,
                            background:T.input, color:T.text,
                            border:`1.5px solid ${T.inputBorder}`,
                            borderRadius:7, textAlign:'center', fontVariantNumeric:'tabular-nums',
                          }}/>
                        <span style={{ fontSize:11, color:T.text2 }}>minutes</span>
                      </div>
                    )}
                    {/* Note presets */}
                    {(ATTENDANCE_NOTE_PRESETS[att.status] || []).length > 0 && (
                      <div style={{ display:'flex', gap:5, flexWrap:'wrap', marginBottom:8 }}>
                        {ATTENDANCE_NOTE_PRESETS[att.status].map(preset => (
                          <Chip key={preset} active={att.note === preset}
                            onClick={()=>setNoteFor(p.id, att.note===preset?'':preset)}
                            style={{ fontSize:11, padding:'4px 10px' }}>
                            {preset}
                          </Chip>
                        ))}
                      </div>
                    )}
                    <input
                      value={att.note || ''} onChange={e=>setNoteFor(p.id, e.target.value)}
                      placeholder={att.status==='late'?'Raison du retard...':att.status==='injured'?'Type de blessure / précisions...':'Note ou précision...'}
                      style={{
                        width:'100%', padding:'7px 10px', fontSize:12.5,
                        background:T.input, color:T.text,
                        border:`1.5px solid ${T.inputBorder}`,
                        borderRadius:7,
                      }}/>
                  </div>
                )}

                {/* Note collapsed preview */}
                {!isExpanded && hasNote && (
                  <div style={{
                    marginTop:8, padding:'6px 10px', background:T.card3, borderRadius:7,
                    fontSize:11.5, color:T.text2, fontStyle:'italic',
                    display:'flex', alignItems:'center', gap:6,
                  }}>
                    <Icon name="noteEdit" size={11} color={T.text3}/>
                    <span style={{ flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{att.note}</span>
                    {att.status === 'late' && att.lateMinutes > 0 && (
                      <span style={{ color:T.warning, fontWeight:700 }}>+{att.lateMinutes}min</span>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </Card>
  );
}

/* ============================================================
   SESSION BUILDER
============================================================ */
function SessionBuilder({ session, setSession, onSave, onCancel, onDelete, onLive, players, T, confirmDelete, setConfirmDelete, deleteSession }) {
  const [picker, setPicker] = useState(false);
  const [filterCat, setFilterCat] = useState('all');
  const [search, setSearch] = useState('');

  const filteredExercises = useMemo(() => {
    return EXERCISES.filter(e => {
      if (filterCat !== 'all' && e.cat !== filterCat) return false;
      if (search) {
        const q = search.toLowerCase();
        return e.name.toLowerCase().includes(q) || e.desc.toLowerCase().includes(q);
      }
      return true;
    });
  }, [filterCat, search]);

  function addExercise(eid) {
    setSession({ ...session, exercises: [...session.exercises, eid] });
  }
  function removeExercise(idx) {
    setSession({ ...session, exercises: session.exercises.filter((_,i)=>i!==idx) });
  }
  function moveExercise(idx, dir) {
    const newOrder = [...session.exercises];
    const target = idx + dir;
    if (target < 0 || target >= newOrder.length) return;
    [newOrder[idx], newOrder[target]] = [newOrder[target], newOrder[idx]];
    setSession({ ...session, exercises: newOrder });
  }
  function setStatusFor(pid, status) {
    setSession(setAttendanceFor(session, pid, { status }));
  }
  function setNoteFor(pid, note) {
    setSession(setAttendanceFor(session, pid, { note }));
  }
  function setLateMinFor(pid, lateMinutes) {
    setSession(setAttendanceFor(session, pid, { lateMinutes }));
  }
  function markAll(status) {
    const newAttendance = {};
    players.forEach(p => {
      const cur = getAttendance(session, p.id);
      newAttendance[p.id] = { ...cur, status };
    });
    setSession({ ...session, attendance: newAttendance });
  }
  function resetAttendance() {
    setSession({ ...session, attendance: {} });
  }
  function copyFromLastSession() {
    // not implemented yet — placeholder for future
  }

  const totalDuration = session.exercises.reduce((sum,eid) => sum + (EXERCISES.find(e=>e.id===eid)?.dur||0), 0);
  const attCounts = attendanceCountsFor(session, players);
  const presentCount = attCounts.present + attCounts.late;

  return (
    <PageContainer>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:16 }}>
        <IconBtn icon="arrowLeft" onClick={onCancel}/>
        <h1 style={{ fontSize:24, fontWeight:800, color:T.text, margin:0, flex:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          {(session.themes && session.themes.length>0) || session.theme ? sessionDisplayTheme(session) : 'Nouvelle séance'}
        </h1>
        <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
        <Btn variant="primary" onClick={onSave}>Enregistrer</Btn>
        {!session.done && session.exercises.length>0 && (
          <Btn variant="success" icon="play" onClick={onLive}>Démarrer</Btn>
        )}
      </div>

      {/* General info */}
      <Card padding={16} style={{ marginBottom:16 }}>
        <SectionTitle>Informations générales</SectionTitle>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))', gap:12 }}>
          <Input label="Date" type="date" value={session.date} onChange={v=>setSession({...session, date:v})}/>
          <Input label="Heure" type="time" value={session.time} onChange={v=>setSession({...session, time:v})}/>
          <Input label="Durée (min)" type="number" value={session.duration} onChange={v=>setSession({...session, duration:v})}/>
          <Select label="Lieu" value={session.location} onChange={v=>setSession({...session, location:v})}
            options={LOCATIONS.map(l=>({ value:l, label:l, icon:'pin' }))} placeholder=""/>
        </div>
        <div style={{ marginTop:12 }}>
          <MultiSelect label="Thèmes de la séance"
            values={session.themes||[]} onChange={v=>setSession({...session, themes:v})}
            options={SESSION_THEMES.map(t=>({ value:t.id, label:t.label, color:t.color, cat:t.cat }))}
            placeholder="Choisir un ou plusieurs thèmes..." maxDisplay={6} groupBy="cat"/>
        </div>
        <div style={{ marginTop:12 }}>
          <Input label="Thème complémentaire (libre)" value={session.theme} onChange={v=>setSession({...session, theme:v})}
            placeholder="Optionnel — précision si besoin"/>
        </div>
        <div style={{ marginTop:12 }}>
          <Textarea label="Objectifs" value={session.objectives} onChange={v=>setSession({...session, objectives:v})} placeholder="Ce que les joueurs doivent retenir..."/>
        </div>
      </Card>

      {/* Exercises */}
      <Card padding={16} style={{ marginBottom:16 }}>
        <SectionTitle action={<Btn size="sm" icon="plus" onClick={()=>setPicker(true)}>Ajouter un exercice</Btn>}>
          Exercices ({session.exercises.length}) · {totalDuration} min
        </SectionTitle>
        {session.exercises.length === 0 ? (
          <EmptyState icon="clipboard" title="Aucun exercice"
            message="Ajoute des exercices depuis la bibliothèque"
            action={<Btn size="md" icon="plus" onClick={()=>setPicker(true)}>Bibliothèque d'exercices</Btn>}/>
        ) : (
          <div style={{ display:'grid', gap:8 }}>
            {session.exercises.map((eid, idx) => {
              const ex = EXERCISES.find(e=>e.id===eid);
              if (!ex) return null;
              const cat = EXERCISE_CATEGORIES.find(c=>c.id===ex.cat);
              return (
                <div key={idx} style={{
                  display:'flex', alignItems:'center', gap:10,
                  padding:12, background:T.card2, borderRadius:10,
                  border:`1px solid ${T.border}`,
                }}>
                  <div style={{
                    width:32, height:32, borderRadius:8,
                    background:cat.color+'25', color:cat.color,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    fontSize:14, fontWeight:800,
                  }}>{idx+1}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:14, fontWeight:700, color:T.text }}>{ex.name}</div>
                    <div style={{ fontSize:11, color:T.text2, marginTop:2 }}>
                      <span style={{ color:cat.color, fontWeight:600 }}>{cat.label}</span> · {ex.dur} min · {ex.players} joueurs
                    </div>
                  </div>
                  <div style={{ display:'flex', gap:4 }}>
                    <IconBtn icon="arrowUp" size={30} onClick={()=>moveExercise(idx,-1)} title="Monter"/>
                    <IconBtn icon="arrowDown" size={30} onClick={()=>moveExercise(idx,1)} title="Descendre"/>
                    <IconBtn icon="close" size={30} onClick={()=>removeExercise(idx)} title="Retirer" color={T.danger}/>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      {/* Attendance */}
      <AttendanceSection session={session} players={players} T={T}
        setStatusFor={setStatusFor} setNoteFor={setNoteFor} setLateMinFor={setLateMinFor}
        markAll={markAll} resetAttendance={resetAttendance}
        attCounts={attCounts}/>

      {/* Notes */}
      <Card padding={16}>
        <SectionTitle>Notes</SectionTitle>
        <Textarea value={session.notes} onChange={v=>setSession({...session, notes:v})}
          placeholder="Observations, remarques, points à retravailler..." rows={4}/>
      </Card>

      {/* Exercise Picker Modal */}
      <Modal open={picker} onClose={()=>setPicker(false)} title="Bibliothèque d'exercices" width={780}
        footer={<Btn variant="primary" onClick={()=>setPicker(false)}>Terminé</Btn>}>
        <Input value={search} onChange={setSearch} placeholder="Rechercher..." icon="search" style={{ marginBottom:12 }}/>
        <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:12 }}>
          <Chip active={filterCat==='all'} onClick={()=>setFilterCat('all')}>Toutes ({EXERCISES.length})</Chip>
          {EXERCISE_CATEGORIES.map(c => (
            <Chip key={c.id} active={filterCat===c.id} onClick={()=>setFilterCat(c.id)} color={c.color}
              icon={c.icon} count={EXERCISES.filter(e=>e.cat===c.id).length}>{c.label}</Chip>
          ))}
        </div>
        <div style={{ display:'grid', gap:8, maxHeight:'60vh', overflowY:'auto' }}>
          {filteredExercises.map(ex => {
            const cat = EXERCISE_CATEGORIES.find(c=>c.id===ex.cat);
            const inSession = session.exercises.includes(ex.id);
            return (
              <div key={ex.id} style={{
                padding:12, background:T.card2, borderRadius:10,
                border:`1px solid ${inSession?T.success:T.border}`,
              }}>
                <div style={{ display:'flex', alignItems:'flex-start', gap:10 }}>
                  <div style={{
                    width:36, height:36, borderRadius:9,
                    background:cat.color+'1F', color:cat.color,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    flexShrink:0,
                  }}><Icon name={cat.icon} size={18}/></div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4, flexWrap:'wrap' }}>
                      <div style={{ fontSize:14, fontWeight:700, color:T.text }}>{ex.name}</div>
                      <Badge bg={cat.color+'25'} color={cat.color}>{cat.label}</Badge>
                      <Badge bg={T.card3} color={T.text2}>{ex.dur} min</Badge>
                      <Badge bg={T.card3} color={T.text2}>{ex.players}</Badge>
                    </div>
                    <div style={{ fontSize:12, color:T.text2, lineHeight:1.4, marginBottom:6 }}>{ex.desc}</div>
                    <div style={{ fontSize:11, color:T.text3, fontStyle:'italic', display:'flex', alignItems:'center', gap:5 }}><Icon name="bulb" size={11} color={T.text3}/> {ex.coach}</div>
                  </div>
                  <Btn size="sm" variant={inSession?'success':'primary'}
                    icon={inSession?'check':'plus'} onClick={()=>addExercise(ex.id)}>
                    {inSession?'Ajouté':'Ajouter'}
                  </Btn>
                </div>
              </div>
            );
          })}
        </div>
      </Modal>

      <ConfirmDialog open={!!confirmDelete} title="Supprimer cette séance ?"
        message="Cette action est irréversible."
        onConfirm={()=>deleteSession(confirmDelete)} onCancel={()=>setConfirmDelete(null)}/>
    </PageContainer>
  );
}

/* ============================================================
   SESSION LIVE (chronomètre + exercice en cours)
============================================================ */
function SessionLive({ session, setSession, players, onEnd, T }) {
  const [currentExIdx, setCurrentExIdx] = useState(0);
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0); // seconds
  const [globalElapsed, setGlobalElapsed] = useState(0);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setElapsed(e => e + 1);
        setGlobalElapsed(e => e + 1);
      }, 1000);
    } else {
      if (intervalRef.current) clearInterval(intervalRef.current);
    }
    return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
  }, [running]);

  const currentEx = session.exercises[currentExIdx] ? EXERCISES.find(e=>e.id===session.exercises[currentExIdx]) : null;
  const currentCat = currentEx ? EXERCISE_CATEGORIES.find(c=>c.id===currentEx.cat) : null;
  const targetDuration = currentEx ? currentEx.dur * 60 : 0;
  const progress = targetDuration > 0 ? Math.min(elapsed/targetDuration*100, 100) : 0;

  function nextExercise() {
    if (currentExIdx < session.exercises.length - 1) {
      setCurrentExIdx(currentExIdx+1);
      setElapsed(0);
    }
  }
  function prevExercise() {
    if (currentExIdx > 0) {
      setCurrentExIdx(currentExIdx-1);
      setElapsed(0);
    }
  }
  function finish() {
    setRunning(false);
    onEnd(session);
  }

  return (
    <div style={{
      minHeight:'calc(100vh - 60px)',
      background: currentCat ? `linear-gradient(135deg, ${currentCat.color}25 0%, ${T.bg} 50%)` : T.bg,
      transition: 'background 0.5s',
    }}>
      <PageContainer>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:16 }}>
          <IconBtn icon="arrowLeft" onClick={()=>onEnd(null)}/>
          <div style={{ flex:1 }}>
            <h1 style={{ fontSize:22, fontWeight:800, color:T.text, margin:0, lineHeight:1.1 }}>
              Séance en cours
            </h1>
            <div style={{ fontSize:12, color:T.text2, marginTop:2 }}>{sessionDisplayTheme(session)}</div>
          </div>
          <Badge bg={T.dangerLight} color={T.danger}><span className="pulse" style={{ display:'inline-flex' }}><Icon name="dot" size={10} color={T.danger}/></span> LIVE</Badge>
        </div>

        {/* Global clock */}
        <Card padding={20} style={{ marginBottom:16, textAlign:'center' }}>
          <div style={{ fontSize:11, color:T.text2, textTransform:'uppercase', letterSpacing:1, fontWeight:700, marginBottom:6 }}>Temps total écoulé</div>
          <div style={{ fontSize:48, fontWeight:800, color:T.text, fontVariantNumeric:'tabular-nums', letterSpacing:-1 }}>
            {mmss(globalElapsed)}
          </div>
          <div style={{ fontSize:12, color:T.text2, marginTop:4 }}>sur {session.duration} min prévues</div>
        </Card>

        {/* Current exercise */}
        {currentEx ? (
          <Card padding={20} style={{ marginBottom:16, borderColor: currentCat.color }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14, flexWrap:'wrap' }}>
              <Badge bg={currentCat.color} color="#fff"><Icon name={currentCat.icon} size={11}/> {currentCat.label}</Badge>
              <Badge bg={T.card3} color={T.text2}>Exercice {currentExIdx+1}/{session.exercises.length}</Badge>
            </div>
            <h2 style={{ fontSize:24, fontWeight:800, color:T.text, margin:'0 0 8px 0' }}>{currentEx.name}</h2>
            <div style={{ display:'flex', gap:14, flexWrap:'wrap', marginBottom:14, color:T.text2, fontSize:12 }}>
              <span style={{ display:'inline-flex', alignItems:'center', gap:5 }}><Icon name="clock" size={13}/> {currentEx.dur} min</span>
              <span style={{ display:'inline-flex', alignItems:'center', gap:5 }}><Icon name="users" size={13}/> {currentEx.players}</span>
              <span style={{ display:'inline-flex', alignItems:'center', gap:5 }}><Icon name="target" size={13}/> {currentEx.mat}</span>
            </div>
            <div style={{ padding:12, background:T.card2, borderRadius:10, marginBottom:10 }}>
              <div style={{ fontSize:11, fontWeight:700, color:T.text2, textTransform:'uppercase', marginBottom:6 }}>Description</div>
              <div style={{ fontSize:14, color:T.text, lineHeight:1.5 }}>{currentEx.desc}</div>
            </div>
            <div style={{ padding:12, background:T.warningLight, borderRadius:10 }}>
              <div style={{ fontSize:11, fontWeight:700, color:T.warning, textTransform:'uppercase', marginBottom:6, display:'flex', alignItems:'center', gap:5 }}><Icon name="bulb" size={12}/> Conseils coach</div>
              <div style={{ fontSize:14, color:T.text, lineHeight:1.5 }}>{currentEx.coach}</div>
            </div>

            <div style={{ marginTop:18 }}>
              <ProgressBar value={elapsed} max={targetDuration||1} color={currentCat.color} height={10} label="Progression" showValue={false}/>
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:12, fontWeight:600, color:T.text2, marginTop:4 }}>
                <span>{mmss(elapsed)}</span>
                <span>{mmss(targetDuration)}</span>
              </div>
            </div>
          </Card>
        ) : (
          <Card><EmptyState title="Aucun exercice" icon="clipboard"/></Card>
        )}

        {/* Controls */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginBottom:16 }}>
          <Btn size="lg" variant="secondary" icon="skipBack" onClick={prevExercise} disabled={currentExIdx===0}>Précédent</Btn>
          <Btn size="lg" variant={running?'danger':'success'} icon={running?'pause':'play'} onClick={()=>setRunning(!running)}>
            {running?'Pause':'Démarrer'}
          </Btn>
          <Btn size="lg" variant="secondary" icon="skipForward" onClick={nextExercise} disabled={currentExIdx>=session.exercises.length-1}>Suivant</Btn>
        </div>

        <Btn fullWidth size="lg" variant="primary" icon="check" onClick={finish}>Terminer la séance</Btn>
      </PageContainer>
    </div>
  );
}
