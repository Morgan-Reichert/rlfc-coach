                })()}
              </Card>
            </>
          ) : (
            <Card><EmptyState icon="user" title="Sélectionne un joueur" message="Choisis un joueur pour voir et modifier ses évaluations"/></Card>
          )}
        </>
      )}
    </PageContainer>
  );
}


/* ============================================================
   SAISON (calendar + stats globales)
============================================================ */
function SaisonPage({ players, matches, sessions, evals, T, showToast, triggerAction }) {
  const [tab, setTab] = useState(0); // 0=overview 1=calendar 2=playtime

  const stats = useMemo(() => {
    const done = matches.filter(m => m.status === 'done');
    const wins = done.filter(m => m.score.us > m.score.them);
    const draws = done.filter(m => m.score.us === m.score.them);
    const losses = done.filter(m => m.score.us < m.score.them);
    const goalsFor = done.reduce((s,m)=>s+m.score.us, 0);
    const goalsAgainst = done.reduce((s,m)=>s+m.score.them, 0);
    const cleanSheets = done.filter(m => m.score.them === 0).length;
    const doneSessions = sessions.filter(s => s.done).length;
    return {
      totalMatches: done.length, totalPrepared: matches.length-done.length,
      wins:wins.length, draws:draws.length, losses:losses.length,
      goalsFor, goalsAgainst, goalsDiff: goalsFor-goalsAgainst,
      cleanSheets, doneSessions,
      points: wins.length*3 + draws.length,
      avgFor: done.length>0 ? (goalsFor/done.length).toFixed(2) : '0.00',
      avgAgainst: done.length>0 ? (goalsAgainst/done.length).toFixed(2) : '0.00',
    };
  }, [matches, sessions]);

  // Top scorers / assists from events
  const playerStats = useMemo(() => {
    const acc = {};
    players.forEach(p => { acc[p.id] = { player:p, goals:0, assists:0, yellow:0, red:0, played:0, minutes:0 }; });
    matches.filter(m => m.status === 'done').forEach(m => {
      m.lineup.forEach(pid => { if (acc[pid]) { acc[pid].played++; acc[pid].minutes += m.duration; } });
      m.bench.forEach(pid => { if (acc[pid]) { acc[pid].played++; } });
      m.events.forEach(ev => {
        const a = acc[ev.playerId];
        if (!a) return;
        if (ev.type === 'goal') a.goals++;
        else if (ev.type === 'assist') a.assists++;
        else if (ev.type === 'yellow') a.yellow++;
        else if (ev.type === 'red') a.red++;
      });
    });
    return Object.values(acc).sort((a,b) => (b.goals*2+b.assists) - (a.goals*2+a.assists));
  }, [matches, players]);

  return (
    <PageContainer>
      <PageHeader title="Saison" subtitle="Bilan global et statistiques"/>

      <Tabs tabs={['Vue d\'ensemble','Calendrier','Temps de jeu','Présences']} active={tab} onChange={setTab} style={{ marginBottom:16 }}/>

      {tab === 0 && (
        <>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))', gap:12, marginBottom:18 }}>
            <StatCard icon="trophy" label="Points" value={stats.points} sub={`${stats.totalMatches} match(s)`} color={T.gold}/>
            <StatCard icon="checkCircle" label="Victoires" value={stats.wins} sub={stats.totalMatches?`${Math.round(stats.wins/stats.totalMatches*100)}%`:'-'} color={T.success}/>
            <StatCard icon="equals" label="Nuls" value={stats.draws} color={T.warning}/>
            <StatCard icon="xCircle" label="Défaites" value={stats.losses} color={T.danger}/>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))', gap:12, marginBottom:18 }}>
            <StatCard icon="ball" label="Buts pour" value={stats.goalsFor} sub={`${stats.avgFor}/match`} color={T.success}/>
            <StatCard icon="net" label="Buts contre" value={stats.goalsAgainst} sub={`${stats.avgAgainst}/match`} color={T.danger}/>
            <StatCard icon="chart" label="Différence" value={(stats.goalsDiff>=0?'+':'')+stats.goalsDiff} color={stats.goalsDiff>=0?T.success:T.danger}/>
            <StatCard icon="glove" label="Clean sheets" value={stats.cleanSheets} color={T.info}/>
          </div>

          <Card padding={16} style={{ marginBottom:16 }}>
            <SectionTitle>Meilleurs buteurs</SectionTitle>
            {playerStats.filter(s=>s.goals>0).length === 0 ? (
              <EmptyState icon="ball" title="Aucun but" message="Les buts seront comptabilisés depuis les matchs"/>
            ) : (
              <div style={{ display:'grid', gap:6 }}>
                {playerStats.filter(s=>s.goals>0).slice(0,10).map((s,i) => (
                  <div key={s.player.id} style={{
                    display:'flex', alignItems:'center', gap:10,
                    padding:'8px 12px', background:T.card2, borderRadius:10,
                  }}>
                    <div style={{
                      width:24, height:24, borderRadius:12,
                      background: i<3 ? T.gold : T.card3, color: i<3?'#1C1C1E':T.text2,
                      display:'flex', alignItems:'center', justifyContent:'center',
                      fontSize:11, fontWeight:800,
                    }}>{i+1}</div>
                    <Avatar name={`${s.player.firstName} ${s.player.lastName}`} size={32}/>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:T.text }}>{s.player.firstName} {s.player.lastName}</div>
                      <div style={{ fontSize:11, color:T.text2 }}>#{s.player.number} · {s.played} matchs</div>
                    </div>
                    <div style={{ display:'flex', gap:6 }}>
                      <Badge bg={T.success} color="#fff"><Icon name="ball" size={11}/> {s.goals}</Badge>
                      {s.assists>0 && <Badge bg={T.info} color="#fff"><Icon name="target" size={11}/> {s.assists}</Badge>}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Card>
        </>
      )}

      {tab === 1 && <SeasonCalendar matches={matches} sessions={sessions} T={T} triggerAction={triggerAction}/>}

      {tab === 2 && (
        <Card padding={16}>
          <SectionTitle>Temps de jeu</SectionTitle>
          {playerStats.length === 0 ? (
            <EmptyState icon="clock" title="Aucune donnée"/>
          ) : (
            <div style={{ display:'grid', gap:6 }}>
              {[...playerStats].sort((a,b)=>b.minutes-a.minutes).map(s => {
                const maxMinutes = Math.max(1, ...playerStats.map(x=>x.minutes));
                return (
                  <div key={s.player.id} style={{
                    display:'flex', alignItems:'center', gap:10,
                    padding:'8px 12px', background:T.card2, borderRadius:10,
                  }}>
                    <Avatar name={`${s.player.firstName} ${s.player.lastName}`} size={32}/>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:T.text }}>
                        #{s.player.number} {s.player.firstName} {s.player.lastName}
                      </div>
                      <div style={{ marginTop:4 }}>
                        <ProgressBar value={s.minutes} max={maxMinutes} color={T.info} height={5} showValue={false}/>
                      </div>
                    </div>
                    <div style={{ textAlign:'right', minWidth:80 }}>
                      <div style={{ fontSize:14, fontWeight:800, color:T.text }}>{s.minutes} min</div>
                      <div style={{ fontSize:11, color:T.text2 }}>{s.played} match(s)</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </Card>
      )}

      {tab === 3 && <TeamAttendanceTab players={players} sessions={sessions} T={T}/>}
    </PageContainer>
  );
}

/* ============================================================
   TEAM ATTENDANCE TAB (présences saison équipe)
============================================================ */
function TeamAttendanceTab({ players, sessions, T }) {
  const doneSessions = useMemo(() => (sessions||[]).filter(s => s.done), [sessions]);
  const playerRows = useMemo(() => {
    return (players||[])
      .map(p => ({ player:p, stats: playerAttendanceStats(sessions, p.id) }))
      .sort((a,b) => b.stats.rate - a.stats.rate);
  }, [players, sessions]);

  const teamAvg = useMemo(() => {
    if (playerRows.length === 0 || doneSessions.length === 0) return 0;
    const totalRate = playerRows.reduce((s,r) => s + r.stats.rate, 0);
    return totalRate / playerRows.length;
  }, [playerRows, doneSessions]);

  if (doneSessions.length === 0) {
    return (
      <Card>
        <EmptyState icon="clock" title="Aucune séance terminée"
          message="Les statistiques de présence apparaîtront après ta première séance terminée"/>
      </Card>
    );
  }

  const teamColor = teamAvg >= 0.85 ? T.success : (teamAvg >= 0.70 ? T.warning : T.danger);

  return (
    <>
      {/* Vue d'ensemble équipe */}
      <Card padding={20} style={{ marginBottom:14 }}>
        <SectionTitle>Présence moyenne ({doneSessions.length} séances)</SectionTitle>
        <div style={{
          padding:18, background:`linear-gradient(135deg, ${teamColor}18 0%, ${T.card2} 100%)`,
          borderRadius:12, border:`1px solid ${teamColor}40`,
          display:'flex', alignItems:'center', gap:16,
        }}>
          <div style={{
            width:76, height:76, borderRadius:38,
            background:teamColor, color:'#fff',
            display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:24, fontWeight:800, fontVariantNumeric:'tabular-nums',
            flexShrink:0, letterSpacing:-0.5,
          }}>{Math.round(teamAvg*100)}%</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:14, fontWeight:700, color:T.text, marginBottom:4 }}>Taux de présence moyen équipe</div>
            <div style={{ fontSize:12, color:T.text2, lineHeight:1.5 }}>
              Sur {doneSessions.length} séance{doneSessions.length>1?'s':''} terminée{doneSessions.length>1?'s':''} cette saison
            </div>
          </div>
        </div>
      </Card>

      {/* Classement joueurs */}
      <Card padding={16} style={{ marginBottom:14 }}>
        <SectionTitle>Classement par assiduité</SectionTitle>
        {playerRows.length === 0 ? (
          <EmptyState icon="users" title="Aucun joueur"/>
        ) : (
          <div style={{ display:'grid', gap:6 }}>
            {playerRows.map((r, i) => {
              const rateColor = r.stats.rate >= 0.85 ? T.success : (r.stats.rate >= 0.70 ? T.warning : T.danger);
              const pos = POSITIONS.find(x => x.id === r.player.position);
              return (
                <div key={r.player.id} style={{
                  display:'flex', alignItems:'center', gap:10,
                  padding:'10px 12px', background:T.card2, borderRadius:10,
                  border:`1px solid ${T.border}`,
                }}>
                  <div style={{
                    width:24, height:24, borderRadius:12,
                    background: i<3 && r.stats.rate >= 0.85 ? T.gold : T.card3,
                    color: i<3 && r.stats.rate >= 0.85 ? '#1C1C1E' : T.text2,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    fontSize:11, fontWeight:800, flexShrink:0,
                  }}>{i+1}</div>
                  <Avatar name={`${r.player.firstName} ${r.player.lastName}`} size={36} color={pos?.color}/>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:T.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                      #{r.player.number || '?'} {r.player.firstName} {r.player.lastName}
                    </div>
                    <div style={{ fontSize:11, color:T.text2, marginTop:2, display:'flex', gap:8, flexWrap:'wrap' }}>
                      <span style={{ color:T.success }}>{r.stats.present} prés.</span>
                      {r.stats.late > 0 && <span style={{ color:T.warning }}>{r.stats.late} ret.</span>}
                      {r.stats.excused > 0 && <span style={{ color:T.info }}>{r.stats.excused} exc.</span>}
                      {r.stats.unexcused > 0 && <span style={{ color:T.danger, fontWeight:700 }}>{r.stats.unexcused} non exc.</span>}
                      {r.stats.injured > 0 && <span style={{ color:T.purple }}>{r.stats.injured} bles.</span>}
                    </div>
                  </div>
                  <div style={{
                    padding:'6px 12px', borderRadius:9,
                    background:rateColor+'20', color:rateColor,
                    fontSize:14, fontWeight:800, fontVariantNumeric:'tabular-nums',
                    minWidth:64, textAlign:'center',
                  }}>{Math.round(r.stats.rate*100)}%</div>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      {/* Alertes */}
      {playerRows.some(r => r.stats.unexcused >= 2) && (
        <Card padding={16}>
          <SectionTitle>Alertes — absences non excusées</SectionTitle>
          <div style={{ display:'grid', gap:6 }}>

              .filter(r => r.stats.unexcused >= 2)
              .sort((a,b) => b.stats.unexcused - a.stats.unexcused)
              .map(r => (
                <div key={r.player.id} style={{
                  display:'flex', alignItems:'center', gap:10,
                  padding:'10px 12px', background:T.dangerLight, borderRadius:10,

                }}>
                  <Icon name="alert" size={16} color={T.danger}/>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:T.text }}>
                      #{r.player.number} {r.player.firstName} {r.player.lastName}

                    <div style={{ fontSize:11, color:T.danger, fontWeight:600 }}>
                      {r.stats.unexcused} absence{r.stats.unexcused>1?'s':''} non excusée{r.stats.unexcused>1?'s':''}
                    </div>
                  </div>
                </div>
              ))}
          </div>
        </Card>
      )}
    </>
  );
}

function SeasonCalendar({ matches, sessions, T, triggerAction }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [selectedCell, setSelectedCell] = useState(null);

  const now = new Date();
  const month = new Date(now.getFullYear(), now.getMonth()+monthOffset, 1);
  const monthLabel = month.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
  const firstDay = new Date(month);
  const startDay = (firstDay.getDay()+6)%7;
  const daysInMonth = new Date(month.getFullYear(), month.getMonth()+1, 0).getDate();
  const monthInSeason = SEASON_MONTHS_ON.includes(month.getMonth());

  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt = new Date(month.getFullYear(), month.getMonth(), d);
    const dayMatches = matches.filter(m => m.date === iso);
    const daySessions = sessions.filter(s => s.date === iso);
    const isTraining = isTrainingDay(dt);
    cells.push({ d, iso, dt, matches:dayMatches, sessions:daySessions, isTraining });
  }

  const weekdays = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const todayIsoVal = todayIso();

  function openDay(cell) { setSelectedCell(cell); }
  function closeDay() { setSelectedCell(null); }
  function handleAction(action) {
    closeDay();
    if (triggerAction) triggerAction(action);
  }

  return (
    <>
      <Card padding={16}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6, gap:8 }}>
          <IconBtn icon="chevronLeft" onClick={()=>setMonthOffset(monthOffset-1)}/>
          <div style={{ flex:1, textAlign:'center' }}>
            <h3 style={{ fontSize:16, fontWeight:700, color:T.text, margin:0, textTransform:'capitalize', letterSpacing:-0.2 }}>{monthLabel}</h3>

          <div style={{ textAlign:'center', marginBottom:6 }}>

          </div>

          </span>

        </div>

        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:8 }}>
          {weekdays.map((w,i) => (
            <div key={w} style={{
              textAlign:'center', fontSize:11, fontWeight:700,
              color: (TRAINING_DAYS.includes((i+1)%7)) ? T.success : T.text2,
              padding:4, textTransform:'uppercase', letterSpacing:0.5,
            }}>{w}</div>
          ))}
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4 }}>

            if (!cell) return <div key={i}/>;
            const hasMatch = cell.matches.length > 0;
            const hasSession = cell.sessions.length > 0;
            const isToday = cell.iso === todayIsoVal;
            const showTrainingSlot = cell.isTraining && !hasSession && !hasMatch;
            return (
              <button key={i} onClick={()=>openDay(cell)}
                title={showTrainingSlot ? `Créneau d'entraînement — ${TRAINING_TIME_START} → ${TRAINING_TIME_END}` : `${cell.d} · Tap pour actions`}

                  minHeight:68, padding:6, borderRadius:9,

                  borderStyle: showTrainingSlot && !isToday ? 'dashed' : 'solid',
                  display:'flex', flexDirection:'column', gap:3,
                  position:'relative', overflow:'hidden',
                  cursor:'pointer', textAlign:'left',
                  transition:'transform 0.1s, box-shadow 0.15s',

                    letterSpacing:0.2, lineHeight:1.2,
                    marginTop:'auto',
                  }}>
                    {TRAINING_TIME_START.replace(':','h')}<br/>{TRAINING_TIME_END.replace(':','h')}
                  </div>
                )}
                {hasMatch && cell.matches.map(m => {
                  const mt = MATCH_TYPES.find(t=>t.id===m.type);
                  return (
                    <div key={m.id} style={{
                      fontSize:9, fontWeight:700, color:'#fff',
                      background: mt.color, padding:'2px 4px', borderRadius:4,
                      whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
                      display:'flex', alignItems:'center', gap:3,

                {hasSession && cell.sessions.map(s => {
                  const lbl = sessionDisplayTheme(s);
                  return (
                    <div key={s.id} style={{
                      fontSize:9, fontWeight:700, color:'#fff',
                      background: T.info, padding:'2px 4px', borderRadius:4,

        <div style={{ marginTop:14, padding:'10px 12px', background:T.card2, borderRadius:9, border:`1px solid ${T.border}`, display:'flex', alignItems:'center', gap:10 }}>
          <Icon name="info" size={14} color={T.text2}/>
          <div style={{ fontSize:11.5, color:T.text2, lineHeight:1.4 }}>
            <strong style={{ color:T.text, fontWeight:700 }}>Saison U12</strong> · Entraînements <strong style={{ color:T.success }}>Mercredi</strong> & <strong style={{ color:T.success }}>Vendredi</strong> de <strong>{TRAINING_TIME_START.replace(':','h')}</strong> à <strong>{TRAINING_TIME_END.replace(':','h')}</strong> · d'août à mai
          </div>
        </div>
      </Card>

      {selectedCell && (
        <DayDetailsModal cell={selectedCell} T={T} onClose={closeDay} onAction={handleAction}/>
      )}
    </>
  );
}

/* ============================================================
   SETTINGS MODAL
============================================================ */
function SettingsModal({ open, onClose, settings, setSettings, players, sessions, matches, evals, setPlayers, setSessions, setMatches, setEvals, T, showToast }) {
  const [confirmReset, setConfirmReset] = useState(false);

  function exportData() {
    const data = { players, sessions, matches, evals, settings, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rlfc-coach-backup-${todayIso()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Sauvegarde exportée', 'success');
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.players) setPlayers(data.players);
        if (data.sessions) setSessions(data.sessions);
        if (data.matches) setMatches(data.matches);
        if (data.evals) setEvals(data.evals);
        if (data.settings) setSettings(data.settings);
        showToast('Données importées', 'success');
        onClose();
      } catch (err) {
        showToast('Fichier invalide', 'danger');
      }
    };
    reader.readAsText(file);
  }

  function resetAll() {
    setPlayers([]); setSessions([]); setMatches([]); setEvals({});
    setConfirmReset(false);
    showToast('Toutes les données réinitialisées', 'warning');
    onClose();
  }

  return (
    <Modal open={open} onClose={onClose} title="Réglages" width={520}
      footer={<Btn variant="primary" onClick={onClose}>Fermer</Btn>}>
      <div style={{ display:'grid', gap:18 }}>
        <div>
          <SectionTitle>Apparence</SectionTitle>
          <div style={{ display:'flex', gap:8 }}>
            <Btn variant={settings.theme==='light'?'primary':'secondary'} icon="sun" fullWidth onClick={()=>setSettings({...settings, theme:'light'})}>Clair</Btn>
            <Btn variant={settings.theme==='dark'?'primary':'secondary'} icon="moon" fullWidth onClick={()=>setSettings({...settings, theme:'dark'})}>Sombre</Btn>
          </div>
        </div>

        <Divider style={{ margin:0 }}/>

        <div>
          <SectionTitle>Sauvegarde</SectionTitle>
          <div style={{ display:'grid', gap:8 }}>
            <Btn variant="secondary" icon="arrowDown" onClick={exportData}>Exporter mes données (JSON)</Btn>
            <label style={{ display:'block' }}>
              <input type="file" accept=".json" onChange={e=>{if(e.target.files[0]) importData(e.target.files[0]);}} style={{ display:'none' }}/>
              <Btn variant="secondary" icon="arrowUp" fullWidth onClick={(e)=>{ e.preventDefault(); e.currentTarget.previousElementSibling?.click ? null : e.target.previousSibling.click(); }}>Importer une sauvegarde</Btn>
            </label>
          </div>
        </div>

        <Divider style={{ margin:0 }}/>

        <div>
          <SectionTitle>Statistiques de stockage</SectionTitle>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:8, fontSize:13 }}>
            <div style={{ padding:10, background:T.card2, borderRadius:8 }}>
              <div style={{ fontSize:11, color:T.text2, fontWeight:600 }}>JOUEURS</div>
              <div style={{ fontSize:18, fontWeight:800, color:T.text }}>{players.length}</div>
            </div>
            <div style={{ padding:10, background:T.card2, borderRadius:8 }}>
              <div style={{ fontSize:11, color:T.text2, fontWeight:600 }}>SÉANCES</div>
              <div style={{ fontSize:18, fontWeight:800, color:T.text }}>{sessions.length}</div>
            </div>
            <div style={{ padding:10, background:T.card2, borderRadius:8 }}>
              <div style={{ fontSize:11, color:T.text2, fontWeight:600 }}>MATCHS</div>
              <div style={{ fontSize:18, fontWeight:800, color:T.text }}>{matches.length}</div>
            </div>
            <div style={{ padding:10, background:T.card2, borderRadius:8 }}>
              <div style={{ fontSize:11, color:T.text2, fontWeight:600 }}>ÉVALUATIONS</div>
              <div style={{ fontSize:18, fontWeight:800, color:T.text }}>{Object.keys(evals).length}</div>
            </div>
          </div>
        </div>

        <Divider style={{ margin:0 }}/>

        <div>
          <SectionTitle>Zone dangereuse</SectionTitle>
          <Btn variant="danger" fullWidth onClick={()=>setConfirmReset(true)}>Tout réinitialiser</Btn>
        </div>

        <ConfirmDialog open={confirmReset} title="Tout réinitialiser ?"
          message="Toutes les données seront perdues : joueurs, séances, matchs, évaluations. Cette action est irréversible. Pense à exporter une sauvegarde avant !"
          onConfirm={resetAll} onCancel={()=>setConfirmReset(false)}/>
      </div>
    </Modal>
  );
}

function loadSamplePlayers() {
  const firstNames = ['Lucas','Hugo','Noah','Léo','Théo','Jules','Adam','Liam','Gabriel','Raphaël','Louis','Arthur','Maël','Tom','Nathan','Eden'];
  const lastNames = ['Martin','Dubois','Lefevre','Bernard','Petit','Robert','Richard','Durand','Moreau','Laurent','Simon','Michel','Garcia','Roux'];
  const posCycle = ['GK','DC','DC','DG','DD','MC','MC','MG','MD','AC','AG','AD','MC','DC','MC','AC'];
  return Array.from({length:14}, (_,i) => ({
    id: uid(),
    firstName: firstNames[i%firstNames.length],
    lastName: lastNames[i%lastNames.length],
    number: String(i+1),
    position: posCycle[i%posCycle.length],
    foot: i%4===0 ? 'Gauche' : 'Droit',
    birthDate: `2013-${String(((i%12)+1)).padStart(2,'0')}-15`,
    statut: 'Actif',
    notes: '',
    photo: null,
    createdAt: nowMs(),
  }));
}

/* ============================================================
   APP (root component - defined last)
============================================================ */
function App() {
  const [settings, setSettings] = usePersist('settings', { theme:'dark', firstRun:true });
  const [tab, setTab] = usePersist('tab', 'home');
  const [players, setPlayers] = usePersist('players', []);
  const [sessions, setSessions] = usePersist('sessions', []);
  const [matches, setMatches] = usePersist('matches', []);
  const [matchPresets, setMatchPresets] = usePersist('matchPresets', []);
  const [evals, setEvals] = usePersist('evals', {});
  const [showSettings, setShowSettings] = useState(false);
  const [toast, setToast] = useState({ message:'', type:'info' });
  // Cross-page actions (calendar deep-link): { type, date, time?, id? }
  // type: 'newSession' | 'newMatch' | 'openSession' | 'openMatch'
  const [pendingAction, setPendingAction] = useState(null);

  function triggerAction(action) {
    // Detect target tab from action type
    const tabFor = (t) => {
      if (t === 'newSession' || t === 'openSession') return 'seances';
      if (t === 'newMatch'   || t === 'openMatch')   return 'match';
      return null;
    };
    const target = tabFor(action.type);
    setPendingAction(action);
    if (target) setTab(target);
  }

  // First-run sample data
  useEffect(() => {
    if (settings.firstRun && players.length === 0) {
      setPlayers(loadSamplePlayers());
      setSettings({ ...settings, firstRun:false });
    }
  }, []);

  const T = settings.theme === 'light' ? LIGHT : DARK;

  const showToast = useCallback((message, type='info') => {
    setToast({ message, type });
  }, []);

  function toggleTheme() {
    setSettings({ ...settings, theme: settings.theme === 'light' ? 'dark' : 'light' });
  }

  // Apply theme to document
  useEffect(() => {
    document.body.style.background = T.bg;
    document.body.style.color = T.text;
  }, [T]);

  return (
    <ThemeCtx.Provider value={T}>
      <div className="app-shell" style={{
        display:'flex', flexDirection:'column',
        background: T.bg, color:T.text,
      }}>
        <Header onToggleTheme={toggleTheme} onSettings={()=>setShowSettings(true)} themeName={settings.theme}/>

        <main className="scroll-y" style={{
          flex:1, minHeight:0, minWidth:0,
          background: T.bg,
        }}>
          {tab === 'home' && <Dashboard players={players} sessions={sessions} matches={matches} evals={evals} goto={setTab} T={T}/>}
          {tab === 'seances' && <SeancesPage sessions={sessions} setSessions={setSessions} players={players} T={T} showToast={showToast}
            pendingAction={pendingAction} setPendingAction={setPendingAction}/>}
          {tab === 'groupe' && <GroupePage players={players} setPlayers={setPlayers} evals={evals} T={T}/>}
          {tab === 'match' && <MatchPage matches={matches} setMatches={setMatches} players={players}
            matchPresets={matchPresets} setMatchPresets={setMatchPresets}
            T={T} showToast={showToast}
            pendingAction={pendingAction} setPendingAction={setPendingAction}/>}
          {tab === 'suivi' && <SuiviPage players={players} evals={evals} setEvals={setEvals} matches={matches} sessions={sessions} T={T} showToast={showToast}/>}
          {tab === 'saison' && <SaisonPage players={players} matches={matches} sessions={sessions} evals={evals} T={T} showToast={showToast}
            triggerAction={triggerAction}/>}
        </main>

        <BottomNav active={tab} onChange={setTab} T={T}/>

        <SettingsModal open={showSettings} onClose={()=>setShowSettings(false)}
          settings={settings} setSettings={setSettings}
          players={players} sessions={sessions} matches={matches} evals={evals}
          setPlayers={setPlayers} setSessions={setSessions} setMatches={setMatches} setEvals={setEvals}
          T={T} showToast={showToast}/>

        <Toast message={toast.message} type={toast.type} onClose={()=>setToast({message:'',type:'info'})}/>
      </div>
    </ThemeCtx.Provider>
  );
}

/* ============================================================
   MOBILE VIEWPORT FIX (fallback pour navigateurs sans 100dvh)
   Met à jour --app-vh sur resize/orientation/scroll
============================================================ */
(function setupViewportVar() {
  function update() {
    document.documentElement.style.setProperty('--app-vh', `${window.innerHeight * 0.01}px`);
  }
  update();
  window.addEventListener('resize', update);
  window.addEventListener('orientationchange', update);
  // visualViewport pour iOS/Android quand le clavier ou la barre URL change
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', update);
  }
})();

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

</script>
</body>
</html>
